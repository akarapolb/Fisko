// Record history drawer (round 7): every audit entry, AI action and version that mentions a record.
// Any element with data-hist="<key>" opens it; historyBtn() renders the standard button.
const historyBtn = (key, title) => `<button class="btn ghost hist-btn" type="button" data-hist="${esc(key)}" data-hist-title="${esc(title || key)}" aria-label="${L("ประวัติของ", "History of")} ${esc(title || key)}">${L("ประวัติ", "History")}</button>`;
function historyItems(key) {
  // A key may list alternatives separated by "|" (for example a record's Thai and English names).
  // Whole-token match, so "K1" does not also pick up "K12".
  const res = key.split("|").filter(Boolean).map(k => new RegExp(`(^|[^A-Za-z0-9])${k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}($|[^A-Za-z0-9])`, "i"));
  const hit = s => res.some(re => re.test(s || "")), out = [];
  key = key.split("|")[0];
  S.audit.forEach(a => { if (hit(a.target)) out.push({ t: a.t, who: userName(a.user), role: a.role, what: tx(a.action), detail: a.target, kind: "audit" }); });
  (S.aiLog || []).forEach(a => { if (hit(a.target)) out.push({ t: a.t, who: a.user === "system" ? L("ระบบอัตโนมัติ", "Automatic") : userName(a.user), role: null, what: `${a.agent} · ${tx(a.action)}`, detail: a.ok ? `${a.sources} ${L("แหล่งอ้างอิง", "sources")}` : L("ปฏิเสธ", "Declined"), kind: "ai" }); });
  const r = S.requests.find(x => x.id === key);
  if (r) {
    (r.versions || []).forEach(v => out.push({ t: v.t, who: userName(v.by), role: null, what: `${L("บันทึกเวอร์ชัน", "Saved version")} v${v.v}`, detail: `${tx(v.note)} · ${fmt(v.amount)} ${L("บาท", "baht")}`, kind: "version" }));
    (r.comments || []).forEach(c => out.push({ t: c.t, who: userName(c.by), role: c.role, what: c.resolved ? L("ความเห็น (แก้แล้ว)", "Comment (resolved)") : L("ความเห็น", "Comment"), detail: tx(c.text), kind: "comment" }));
  }
  const seen = new Set();
  return out.filter(i => { const s = i.t + i.what + i.detail; if (seen.has(s)) return false; seen.add(s); return true; }).sort((a, b) => (a.t < b.t ? 1 : -1));
}
const HKIND = { audit: ["บันทึกการใช้งาน", "Audit"], ai: ["AI", "AI"], version: ["เวอร์ชัน", "Version"], comment: ["ความเห็น", "Comment"] };
let H_LAST = null;
function openHistory(key, title, opener) {
  const d = $("#hdrawer"), items = historyItems(key);

  d.innerHTML = `<header><div><div class="eyebrow">${L("ประวัติการเปลี่ยนแปลง", "Change history")}</div><b>${esc(title)}</b></div><span class="sp"></span>
      <button class="btn ghost" type="button" id="h-close" aria-label="${L("ปิด", "Close")}">✕</button></header>

        <small>${esc(i.who)}${i.role ? " · " + tx(ROLES[i.role]) : ""} · ${fdate(i.t, true)}</small>${i.detail ? `<div class="sub">${esc(i.detail)}</div>` : ""}</div></li>`).join("")}</ol>`
      : `<span class="sub">${L("ยังไม่มีประวัติของรายการนี้", "No history for this record yet")}</span>`}
      <p class="sub" style="margin-top:12px">${L("ดึงจากบันทึกการใช้งานแบบแก้ไขไม่ได้ (M10)", "Drawn from the append-only audit log (M10)")}</p></div>`;

function bindHistory() {
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-hist]");

  };

      audit(["สร้างสัญญา", "Created a contract"], `${c.id} ${rq.id}`);
      notify(["fin", "exec"], [`สัญญา ${c.id} ผูกพันวงเงิน ${mb(amount)} ล้านบาท`, `Contract ${c.id} commits ${mb(amount)} M`], "fnc-chain");

}

    c.method = method; c.methodWhy = [why || tx(rec.why), why || tx(rec.why)]; famPlan(c.plan).method = method;
    c.methodApproval = needHead ? { status: "pending", t: nowIso(), by: me().id } : { status: "auto", t: nowIso(), by: me().id };
    audit(["เลือกวิธีจัดซื้อ", "Chose the procurement method"], `${c.id} ${tx(PMETHOD[method])}${needHead ? " · รอหัวหน้าพัสดุ" : ""}`); caseLog(c, "method", `${tx(PMETHOD[method])}${needHead ? " (" + L("รอหัวหน้าพัสดุ", "waiting for the head") + ")" : ""}`);
    if (needHead) notify(["prochead"], [`แฟ้ม ${c.id} รออนุมัติวิธีจัดซื้อ`, `Case ${c.id} needs method approval`], `case:${c.id}`);
    done(needHead ? L("ส่งให้หัวหน้าพัสดุอนุมัติ", "Sent to the head of procurement") : L("บันทึกวิธีแล้ว", "Method saved"));
  };

  const mo = $("#mt-ok"); if (mo) mo.onclick = () => head(true);
  const mn = $("#mt-no"); if (mn) mn.onclick = () => head(false);
  const rf = $("#ref-form");

    c.ref = { amount, basis, note: $("#ref-note").value.trim(), by: me().id, t: nowIso() };

  $$("[data-cmform]").forEach(f => (f.onsubmit = e => {

    famPlan(c.plan).egp = { no, stage: c.egp.stage, date: ann };
    audit(["บันทึกข้อมูล e-GP ของแฟ้ม", "Recorded e-GP details for a case"], `${c.id} ${no}`); caseLog(c, "egp", `${no} · ${fdate(ann)} – ${fdate(close)}`); done(L("บันทึกข้อมูล e-GP แล้ว", "e-GP details saved"));
  };
  const cl = $("#case-close"); if (cl) cl.onclick = () => { c.closeElapsed = true; caseLog(c, "closed", c.egp.close); done(); };
  const bf = $("#bid-form");
  if (bf) bf.onsubmit = e => {
    e.preventDefault();

  };
  const qf = $("#quote-form");
  if (qf) qf.onsubmit = e => { e.preventDefault(); const v = $("#q-v").value.trim(); c.quotes.push({ vendor: [v, v], price: Math.round(Number($("#q-p").value)), win: false }); caseLog(c, "quote", `${v} · ${fmt(c.quotes[c.quotes.length - 1].price)}`); done(); };
  $$("[data-qwin]").forEach(b => (b.onclick = () => { c.quotes.forEach((q, i) => (q.win = i === Number(b.dataset.qwin))); audit(["เลือกผู้เสนอราคา", "Chose a quotation"], c.id); done(); }));
  const af = $("#award-form");
  if (af) af.onsubmit = e => {

{

      else if (nx.who === "proc") R(`${c.id} · ${nx.raw ? nx.th : L(nx.th, nx.en)}`, `${caseName(c)} · ${tx([CASE_STATES[n].th, CASE_STATES[n].en])}`, TODAY, `case:${c.id}`, "p-info");

// ---------- seed ----------
function seedCases(s, K) {
  const cond = (th, en) => [th, en];
  s.pcfg = { specificMax: 500000, singleInspectorMax: 100000, minMembers: 3, appealDays: 7, splitDays: 90 };
  s.holidays = ["2026-10-23", "2026-12-05", "2026-12-10", "2026-12-31"];
  s.mrules = [
    { id: "MR-01", type: "value", kind: "any", max: 500000, method: "specific", cond: cond("วงเงินไม่เกินเพดานวิธีเฉพาะเจาะจง", "Value within the specific-method ceiling"), committees: [], appeal: false, conf: "A", effective: "2017-08-23", on: true },
    { id: "MR-02", type: "value", kind: "any", max: null, method: "ebid", cond: cond("วงเงินสูงกว่าเพดานวิธีเฉพาะเจาะจง (ค่าตั้งต้น ต้องยืนยันเกณฑ์ตามประเภทงาน)", "Above the specific-method ceiling (starting value; confirm thresholds by kind of work)"), committees: ["tor", "eval"], appeal: true, conf: "B", effective: "2017-08-23", on: true },
    { id: "MR-03", type: "special", kind: "any", max: null, method: "specific", cond: cond("เหตุพิเศษ: ฉุกเฉิน ผู้ผลิตรายเดียว หรือซื้อเพิ่มจากสัญญาเดิม (ต้องมีหัวหน้าพัสดุอนุมัติ)", "Special case: emergency, sole source or repeat purchase (head must approve)"), committees: [], appeal: false, conf: "B", effective: "2017-08-23", on: true },
    { id: "MR-04", type: "alt", kind: "any", max: null, method: "selective", cond: cond("วิธีคัดเลือก ใช้เมื่อมีเหตุตามระเบียบเท่านั้น (เลือกเองได้โดยหัวหน้าพัสดุอนุมัติ)", "Selective method, only for the reasons the rules allow (head must approve)"), committees: ["buy"], appeal: false, conf: "C", effective: "2017-08-23", on: true },
    { id: "MR-05", type: "alt", kind: "any", max: null, method: "emarket", cond: cond("e-market สำหรับรายการในระบบ (ต้องยืนยันเงื่อนไข)", "e-market for catalogue items (confirm the conditions)"), committees: [], appeal: false, conf: "C", effective: "2017-08-23", on: true },
  ];
  const order = ["fin", "div", "plan", "exec"], cand = s.users.filter(u => u.active && order.includes(u.role) && u.id !== K.PL && u.id !== K.DV).sort((a, b) => order.indexOf(a.role) - order.indexOf(b.role)).map(u => u.id);
  const cmt = (order_, date) => ({ order: order_, date, chair: cand[0], members: cand.slice(1, 3), t: date + "T10:00" });
  s.caseEvents = [];
  const ev = (c, t, type, by, detail) => s.caseEvents.push({ t, case: c.id, type, by, detail: detail || "", state: c.state });
  const states = [9, 9, 5, 2, 1, 1];
  s.cases = s.pplan.map((p, i) => {
    const n = states[i] || 1, rq = s.reqn[i], ct = s.contracts[i];
    const c = { id: "PC-2570-" + String(i + 1).padStart(3, "0"), plan: p.id, reqn: rq ? rq.id : null, line: p.line, kind: p.kind, state: n, method: null, methodWhy: null, special: null, methodApproval: null, committees: {}, ref: null, tor: null, egp: null, quotes: [], award: null, appeal: null, appealElapsed: false, closeElapsed: false, contract: null, cancelled: null };
    ev(c, "2026-09-01T09:00", "created", K.PO, p.id);
    if (n >= 2) ev(c, rq.t, "requested", rq.by, rq.id);
    if (n >= 3) ev(c, rq.decided.t, "approved", K.EX, rq.id);
    if (n >= 3) {
      c.method = p.est <= 5e5 ? "specific" : "ebid"; c.methodWhy = ["ตรงกับคำแนะนำของระบบ", "Matches the system advice"]; c.methodApproval = { status: "auto", t: rq.decided.t, by: K.PO };
      ev(c, rq.decided.t, "method", K.PO, c.method);
    }
    if (n >= 4 && c.method === "ebid") {
      c.ref = { amount: Math.round(p.est * 0.98 / 1e3) * 1e3, basis: ["std", "quotes"], note: "", by: K.PO, t: "2026-09-10T10:00" };
      c.tor = { doc: `TOR_${c.id}_v1.pdf`, t: "2026-09-12T10:00", by: K.PO }; c.committees.tor = cmt("ที่ 41/2569", "2026-09-11");
      ev(c, "2026-09-10T10:00", "ref", K.PO, fmt(c.ref.amount)); ev(c, "2026-09-11T10:00", "committee", K.PO, "TOR"); ev(c, "2026-09-12T10:00", "tor", K.PO, c.tor.doc);
    }
    if (n >= 5) {
      const live = i === 2;
      c.egp = { no: (p.egp && p.egp.no) || "EGP-70-01" + String(i + 1).padStart(2, "0"), announce: live ? "2026-10-14" : "2026-09-03", close: live ? "2026-10-30" : "2026-09-17", stage: p.egp ? p.egp.stage : [["ประกาศเชิญชวน", "Invitation"][0], "Invitation"], date: live ? "2026-10-14" : "2026-09-03", bidders: null };
      ev(c, c.egp.announce + "T09:00", "sourcing", K.PO, c.egp.no);
    }
    if (n >= 9) {
      c.egp.bidders = i === 1 ? 1 : 3; c.committees.eval = cmt("ที่ 52/2569", "2026-09-18");
      const awd = i === 0 ? "2026-09-24" : "2026-09-25", end = i === 0 ? "2026-10-05" : "2026-10-06";
      c.award = { winner: ct.vendor, price: ct.amount, date: awd, appealEnd: end, minutes: "มติเห็นชอบผู้เสนอราคาต่ำสุดที่ผ่านเกณฑ์", why: "" }; c.appealElapsed = true; c.closeElapsed = true; c.contract = ct.id; c.state = 9;
      ev(c, "2026-09-17T16:30", "bidders", K.PO, `${c.egp.bidders}`); ev(c, awd + "T14:00", "award", K.PO, `${ct.vendor[0]} · ${fmt(ct.amount)}`); ev(c, end + "T16:30", "appeal_elapsed", K.PO, end); ev(c, ct.signed + "T14:00", "contract", K.PO, `${ct.id} · ${mb(ct.amount)}`);
    }
    return c;
  });
  s.caseEvents.sort((a, b) => (a.t < b.t ? 1 : -1));
}

/* ---- 63-contracts.js ---- */
// Fisko Procurement round 14 (P2 of the detailed design): contract guarantee, delivery notice and acceptance
// timing (R-10), penalties (R-09), contract variations by approval ladder with versions (R-08, SD-08),
// the three-way payment gate before Fisko Finance (R-11) and closing the case (R-12).
// All rates, ladders and day counts are settings in S.pcfg (M10 → Procurement rules), not fixed numbers.
const utcDay = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((utcDay(b) - utcDay(a)) / 864e5);
const GUAR_TYPE = { bank: ["หนังสือค้ำประกันธนาคาร", "Bank guarantee"], cash: ["เงินสด", "Cash"], bond: ["พันธบัตรรัฐบาล", "Government bond"] };
const EXT_CODE = { force: ["เหตุสุดวิสัย", "Force majeure"], owner: ["ผู้ว่าจ้างเป็นเหตุ", "Employer's fault"], vendor: ["ผู้ขายเป็นเหตุ", "Supplier's fault"] };
const VAR_ST = { pending: [["รออนุมัติ", "Pending"], "p-warn"], approved: [["อนุมัติแล้ว", "Approved"], "p-ok"], rejected: [["ไม่อนุมัติ", "Rejected"], "p-bad"] };
const conCase = c => caseByPlan(c.plan);
const phDue = ph => addDays(ph.due, (ph.ext || 0) + (ph.extV || 0));
// Days late for penalty: from the due date plus forgiven extension days (employer's fault or force majeure) to delivery, or to today if not yet delivered.
function phLate(ph) {
  const from = addDays(ph.due, ph.ext || 0), to = ph.delivered || TODAY;
  return Math.max(0, dayDiff(from, to));
}
const phPenalty = (c, ph) => Math.round(S.pcfg.penaltyPct / 100 * ph.amount * phLate(ph));
const conPenalty = c => c.phases.reduce((a, ph) => a + phPenalty(c, ph), 0);
const penaltyWarn = c => conPenalty(c) > S.pcfg.penaltyCapPct / 100 * c.amount;
const acceptDue = (c, ph) => {
  if (!ph.delivered) return null;
  const k = (conCase(c) || {}).kind, last = ph.n === c.phases.length;
  return addWorkdays(ph.delivered, k === "construction" ? (last ? S.pcfg.acceptWdLast : S.pcfg.acceptWd) : 0);
};
const openDissent = ph => (ph.dissent || []).some(d => !d.resolved);
const phPaid = (c, ph) => S.payreqs.some(p => p.contract === c.id && p.phase === ph.n && p.status === "approved");
const phNet = (c, ph) => Math.max(0, (ph.result === "partial" ? ph.okAmount : ph.amount) - phPenalty(c, ph));
function guarSt(c) {
  const g = c.guarantee; if (!g) return "none";
  if (g.status === "returned") return "returned";
  if (g.expires < TODAY) return "expired";
  return dayDiff(TODAY, g.expires) <= S.pcfg.guaranteeWarnDays ? "expiring" : "held";
}
const GUAR_TAG = { none: [["ไม่มีหลักประกัน", "No guarantee"], "p-bad"], held: [["มีผล", "In force"], "p-ok"], expiring: [["ใกล้หมดอายุ", "Expiring"], "p-warn"], expired: [["หมดอายุ", "Expired"], "p-bad"], returned: [["คืนแล้ว", "Returned"], "p-mute"] };

// ---------- R-11: three-way payment gate ----------
function payGate(c, ph) {
  const inv = ph.invoice, tol = S.pcfg.invoiceTol, ok = (v, th, en) => ({ ok: !!v, label: L(th, en) }), gs = guarSt(c);
  const checks = [
    ok(phaseAccepted(ph) && (ph.result === "ok" || ph.result === "partial") && ph.cert && !openDissent(ph), "คณะกรรมการตรวจรับครบ มีใบตรวจรับ และไม่มีความเห็นแย้งค้าง", "Committee accepted, certificates issued, no open dissent"),
    ok(inv, "มีใบแจ้งหนี้ของงวดนี้", "An invoice is recorded for this phase"),
    ok(inv && inv.contract === c.no && inv.vendor === tx(c.vendor) && Math.abs(inv.amount - ph.amount) <= tol, "ใบแจ้งหนี้ตรงกับสัญญา ผู้ขาย และยอดงวด", "The invoice matches the contract, supplier and phase amount"),
    ok(gs === "held" || gs === "expiring" || gs === "returned" && c.phases.every(x => phPaid(c, x) || x.n === ph.n), "หลักประกันสัญญายังมีผล", "The contract guarantee is in force"),
  ];
  const net = phNet(c, ph), released = !!ph.release, pass = checks.every(x => x.ok);
  return { checks, net, penalty: phPenalty(c, ph), rejected: ph.result === "partial" ? ph.amount - ph.okAmount : 0, pass, released, ok: pass || released };
}
const gateBox = (c, ph) => {
  const g = payGate(c, ph);
  return `<div class="callout" style="margin:0"><b>${L("ประตูเบิกจ่าย (R-11)", "Payment gate (R-11)")}</b>
    <ul class="check" style="margin-top:6px">${g.checks.map(x => `<li><span class="m ${x.ok ? "ok" : "no"}">${x.ok ? "✓" : "×"}</span><div>${esc(x.label)}</div></li>`).join("")}</ul>
    <div class="sub" style="margin-top:6px">${L("ยอดที่ขอได้", "Payable")} = ${fmt(ph.result === "partial" ? ph.okAmount : ph.amount)} − ${L("ค่าปรับ", "penalty")} ${fmt(g.penalty)} = <b>${fmt(g.net)}</b> ${L("บาท", "baht")}${g.rejected ? ` · ${L("ส่วนที่ไม่ผ่านตรวจรับ", "not accepted")} ${fmt(g.rejected)}` : ""}</div>
    ${g.released ? `<div class="sub">${L("ปลดข้อยกเว้นโดย", "Exception released by")} ${esc(userName(ph.release.by))}: ${esc(ph.release.reason)}</div>` : !g.pass ? `<div class="sub">${L("ไม่ผ่านประตู: การเงินส่งคำขอไม่ได้ ระบบจะพักเป็นข้อยกเว้นให้หัวหน้าพัสดุหรือผู้บริหารปลด", "The gate is not passed: Finance can't send the request. It is held as an exception for the head of procurement or the executive to release.")}</div>` : ""}</div>`;
};

// ---------- closing the case (R-12) ----------
function closeChecks(cs) {
  const c = caseCon(cs), ok = (v, th, en) => ({ ok: !!v, label: L(th, en) });
  return [ok(c.phases.every(ph => phaseAccepted(ph)), "ตรวจรับครบทุกงวด", "Every phase accepted"), ok(c.phases.every(ph => phPaid(c, ph)), "เบิกจ่ายครบทุกงวด", "Every phase paid"),
    ok(!c.guarantee || c.guarantee.status === "returned", "คืนหลักประกันแล้ว", "The guarantee is returned"),
    ok(!(c.vars || []).some(v => v.status === "pending") && !c.phases.some(openDissent), "ไม่มีการแก้ไขสัญญาหรือความเห็นแย้งค้าง", "No pending change or dissent")];
}
function closePanel(cs, con) {
  if (cs.close) return `<div class="callout" style="margin:0"><b>${L("ปิดแฟ้มแล้ว", "Closed")}</b> · ${esc(userName(cs.close.by))} · ${fdate(cs.close.t)}<div class="sub">${L("บทเรียน", "Lessons")}: ${esc(cs.close.lessons)}</div><div class="sub">${L("คะแนนผู้ขาย", "Supplier score")}: ${cs.close.score}/5</div></div>`;
  const n = caseState(cs); if (n < 9) return "";
  const chk = closeChecks(cs), all = chk.every(x => x.ok);
  return `<div><b style="font-weight:600">${L("ปิดแฟ้ม (R-12)", "Close the case (R-12)")}</b><ul class="check" style="margin-top:6px">${chk.map(x => `<li><span class="m ${x.ok ? "ok" : "no"}">${x.ok ? "✓" : "×"}</span><div>${esc(x.label)}</div></li>`).join("")}</ul>
    ${isProcRole() ? `<form class="inline-form" id="close-form" style="margin-top:8px"><div class="f" style="flex:2 1 280px"><label for="cl-les">${L("บทเรียนที่ได้", "Lessons learned")}</label><input type="text" id="cl-les" ${all ? "" : "disabled"}></div>
      <div class="f" style="flex:0 1 130px"><label for="cl-sc">${L("คะแนนผู้ขาย", "Supplier score")}</label><select id="cl-sc" ${all ? "" : "disabled"}>${[5, 4, 3, 2, 1].map(x => `<option>${x}</option>`).join("")}</select></div><button class="btn primary" type="submit" ${all ? "" : "disabled"}>${L("ปิดแฟ้ม", "Close the case")}</button></form>` : ""}</div>`;
}

// ---------- actions ----------
function bindContracts() {
  const done = msg => { commit(); renderShell(); route(); if (msg) toast(msg); };
  const two = v => v.split("|"), ph_ = (cid, n) => famCon(cid).phases.find(x => x.n === Number(n));
  $$("[data-copen2]").forEach(b => (b.onclick = () => { CASE_OPEN = b.dataset.copen2; PROC_TAB = "cases"; route(); }));
  $$("[data-gform]").forEach(f => (f.onsubmit = e => { e.preventDefault(); const c = famCon(f.dataset.gform), fd = new FormData(f);
    c.guarantee = { type: fd.get("type"), amount: Math.round(Number(fd.get("amt"))), expires: fd.get("exp"), status: "held", t: nowIso(), by: me().id };
    audit(["บันทึกหลักประกันสัญญา", "Recorded a contract guarantee"], `${c.id} ${fmt(c.guarantee.amount)}`); done(L("บันทึกหลักประกันแล้ว", "Guarantee recorded")); }));
  $$("[data-gret]").forEach(b => (b.onclick = () => { const c = famCon(b.dataset.gret); c.guarantee.status = "returned"; audit(["คืนหลักประกันสัญญา", "Returned a contract guarantee"], c.id); done(L("บันทึกการคืนหลักประกันแล้ว", "Return recorded")); }));
  $$("[data-dlform]").forEach(f => (f.onsubmit = e => { e.preventDefault(); const [cid, n] = two(f.dataset.dlform), c = famCon(cid), ph = ph_(cid, n), d = new FormData(f).get("d");
    if (d < c.signed) { toast(L("วันส่งมอบต้องไม่ก่อนวันลงนามสัญญา", "Delivery can't be before the contract was signed")); return; }
    ph.delivered = d; const late = phLate(ph);
    audit(["บันทึกการแจ้งส่งมอบ", "Recorded a delivery notice"], `${c.id} ${tx(ph.name)}${late ? ` · ${late} วัน` : ""}`);
    notify(c.inspectors, [`${c.id} ${ph.name[0]} แจ้งส่งมอบแล้ว ตรวจรับภายใน ${fdate(acceptDue(c, ph))}`, `${c.id} ${ph.name[1]} was delivered; accept by ${fdate(acceptDue(c, ph))}`], "prc-contracts");
    if (penaltyWarn(c)) notify(["exec", "prochead"], [`สัญญา ${c.id} ค่าปรับสะสมเกินเกณฑ์เตือน พิจารณาบอกเลิกสัญญา`, `Contract ${c.id}: penalties passed the warning limit; consider termination`], "prc-contracts");
    done(late ? L(`บันทึกแล้ว ล่าช้า ${late} วัน ค่าปรับ ${fmt(phPenalty(c, ph))} บาท`, `Saved: ${late} days late, penalty ${fmt(phPenalty(c, ph))} baht`) : L("บันทึกการส่งมอบแล้ว", "Delivery recorded")); }));
  $$("[data-sgform]").forEach(f => (f.onsubmit = e => {
    e.preventDefault(); const [cid, n] = two(f.dataset.sgform), c = famCon(cid), ph = ph_(cid, n), fd = new FormData(f), res = fd.get("res"), note = String(fd.get("note") || "").trim(), amt = Math.round(Number(fd.get("amt")) || 0);
    if (!c.inspectors.includes(me().id)) { toast(L("คุณไม่ได้เป็นกรรมการตรวจรับสัญญานี้", "You're not on this contract's committee")); return; }
    if (!ph.delivered) { toast(L("ต้องบันทึกการแจ้งส่งมอบก่อน", "Record the delivery first")); return; }
    if (ph.n > 1 && !phaseAccepted(c.phases[ph.n - 2])) { toast(L("ต้องตรวจรับงวดก่อนหน้าให้ครบก่อน", "Accept the previous phase first")); return; }
    if (openDissent(ph)) { toast(L("มีความเห็นแย้งค้าง รอหัวหน้าสั่งการ", "A dissent is open; wait for the instruction")); return; }
    if (!sodCheck("SD-02", [me().id], [c.by], c.id)) return;
    if (res === "dissent") {
      if (note.length < 5) { toast(L("ระบุเหตุผลของความเห็นแย้ง", "Give the reason for the dissent")); return; }
      (ph.dissent = ph.dissent || []).push({ by: me().id, note, t: nowIso(), resolved: null });
      audit(["บันทึกความเห็นแย้งในการตรวจรับ", "Recorded an acceptance dissent"], `${c.id} ${tx(ph.name)}`);
      notify(["exec", "prochead"], [`${c.id} ${ph.name[0]} กรรมการไม่รับงาน รอสั่งการ`, `${c.id} ${ph.name[1]}: a member did not accept, instruction needed`], "prc-contracts"); done(L("บันทึกความเห็นแย้งแล้ว เสนอหัวหน้าสั่งการ", "Dissent recorded and sent for instruction")); return;

  const res = k => (AI_RES[k] ? `<div class="callout" style="margin:0">${AI_RES[k]}</div>` : "");
  const risk = S.contracts.flatMap(x => x.phases.filter(ph => !phaseAccepted(ph)).map(ph => ({ x, ph, r: aiDelay(x, ph) }))).sort((a, b) => b.r.s - a.r.s);
  const stat = S.aiDrafts.length ? `${S.aiDrafts.filter(d => d.edit < 0.3).length}/${S.aiDrafts.length}` : "—";
  const vendors = [...new Set(S.contracts.map(x => tx(x.vendor)))];
  return `
  <div class="alert"><div class="ic" style="background:var(--info-soft);color:var(--info)">AI</div><div><b>${L("AI อ่านและร่าง คนตัดสิน", "AI reads and drafts; a person decides")}</b>
    <p>${L("ต้นแบบนี้ใช้กฎและสถิติ ไม่เรียกโมเดลภายนอก (รุ่น rules-1) ทุกการใช้บันทึกใน M09 และปิดเปิดแต่ละ Agent ได้ที่นั่น AI ไม่ให้คะแนนหรือจัดอันดับข้อเสนอ ไม่เลือกผู้ขาย ไม่ประกาศผู้ชนะ ไม่อนุมัติ ไม่เขียนสถานะ 6 ถึง 8 และไม่ส่งข้อมูลลับออกนอกหน่วยงาน", "This prototype uses rules and statistics and calls no outside model (version rules-1). Every use is logged in M09 and each agent can be switched there. AI never scores or ranks bids, selects a supplier, announces a winner, approves, writes in steps 6 to 8 or sends confidential data out.")}</p></div></div>
  <section class="panel"><header><h2>${L("เลือกแฟ้ม", "Choose a case")}</h2></header><div class="body row"><select id="ai-case" aria-label="${L("แฟ้ม", "Case")}">${cs.map(x => `<option value="${x.id}" ${c && x.id === c.id ? "selected" : ""}>${x.id} · ${esc(caseName(x))}</option>`).join("")}</select>${c ? caseStTag(c) : ""}</div></section>
  ${sec(L("AI-01 เสนอรวมความต้องการและเตือนแตกซื้อ", "AI-01 Consolidation and split-purchase watch"), "AG-05", L("เทียบชื่อรายการและหน่วยงานในแผน เสนอรวมซื้อ ไม่ตัดสินว่าผิด", "Compares item names and units in the plan and suggests buying together. It does not judge anyone."), `<div><button class="btn" type="button" id="ai-01" ${pr ? "" : "disabled"}>${L("สแกนแผนจัดซื้อ", "Scan the plan")}</button></div>${res("a01")}`)}
  ${sec(L("AI-03 เสนอราคากลางพร้อมหลักฐาน", "AI-03 Reference price with evidence"), "AG-07", L("อ่านอย่างเดียว ใช้สัญญาเดิมชนิดเดียวกัน ผู้ใช้ต้องกดยืนยันก่อนบันทึกเป็นราคากลาง", "Read-only. Uses past contracts of the same kind. The user must confirm before it becomes the reference price."), `<div><button class="btn" type="button" id="ai-03" ${pr && c ? "" : "disabled"}>${L("เสนอราคากลาง", "Suggest a price")}</button></div>${res("a03")}`)}
  ${sec(L("AI-04 ตรวจความครบถ้วนและข้อความล็อกสเปก", "AI-04 Completeness and spec-lock check"), "AG-02", L("วางข้อความ TOR ระบบชี้ข้อความที่ระบุยี่ห้อหรือรุ่นเฉพาะ เป็นการแนะนำ ไม่ห้าม", "Paste TOR text. It points at wording that names a brand or model. Advice only; nothing is blocked."),
    `<textarea id="ai-tor" rows="4" placeholder="${L("วางข้อความ TOR ที่นี่", "Paste TOR text here")}" style="width:100%">${esc(AI_TOR)}</textarea><div class="row"><button class="btn" type="button" id="ai-04" ${pr ? "" : "disabled"}>${L("ตรวจ TOR และแฟ้ม", "Check the TOR and case")}</button><button class="btn ghost" type="button" id="ai-04s">${L("ใส่ข้อความตัวอย่าง", "Insert sample text")}</button></div>${res("a04")}`)}
  ${sec(L("AI-05 แนะนำวิธีจัดซื้อและเอกสารที่ต้องมี", "AI-05 Method advice and required documents"), "AG-02", L("ใช้กฎจากตารางใน M10 ไม่ใช้โมเดลเรียนรู้", "Uses the rules table in M10; no learned model."), `<div><button class="btn" type="button" id="ai-05" ${pr && c ? "" : "disabled"}>${L("แนะนำวิธี", "Advise the method")}</button></div>${res("a05")}`)}
  ${sec(L("AI-07 เตือนความเสี่ยงงานล่าช้า", "AI-07 Late-delivery risk"), "AG-08", L("คะแนน 0-100 พร้อมเหตุผล จากกำหนดส่งมอบ ประวัติงวดและผู้ขาย", "A 0-100 score with reasons, from due dates and the phase and supplier history."),
    `<div class="tbl-wrap"><table><thead><tr><th>${L("สัญญา / งวด", "Contract / phase")}</th><th class="n">${L("ความเสี่ยง", "Risk")}</th><th>${L("เหตุผล", "Why")}</th><th></th></tr></thead><tbody>${risk.map(({ x, ph, r }) => `<tr><td><span class="mono">${x.id}</span> ${tx(ph.name)}<div class="sub">${esc(tx(x.vendor))}</div></td><td class="n"><b>${r.s}</b></td><td class="sub">${r.reasons.map(z => tx(z)).join(" · ") || "—"}</td><td>${pr && r.s >= 15 ? `<button class="btn" type="button" data-ailtr="${x.id}">${L("ร่างหนังสือเร่งรัด", "Draft reminder")}</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="4" class="sub">—</td></tr>`}</tbody></table></div>${res("a07")}`)}
  ${sec(L("AI-02 / AI-11 ร่างเอกสาร", "AI-02 / AI-11 Draft documents"), "AG-07", L("ร่างให้คนแก้ ระบบเก็บร่างของ AI และฉบับสุดท้ายเพื่อวัดว่าแก้มากแค่ไหน", "Drafts for a person to edit. The AI draft and the final text are both kept so the amount of editing can be measured."),
    `<div class="row"><select id="ai-dt" aria-label="${L("ชนิดเอกสาร", "Document")}">${Object.keys(DOC_T).map(k => `<option value="${k}" ${k === AI_DOCT ? "selected" : ""}>${tx(DOC_T[k][0])}</option>`).join("")}</select><button class="btn" type="button" id="ai-02" ${pr && c ? "" : "disabled"}>${L("สร้างร่าง", "Create a draft")}</button></div>
    ${AI_RES.draft ? `<textarea id="ai-draft" rows="9" style="width:100%">${esc(AI_RES.draft)}</textarea><div class="row"><button class="btn primary" type="button" id="ai-use">${L("ยืนยันใช้ฉบับนี้", "Confirm and use this version")}</button><span class="sub">${L("แก้ไขได้ก่อนกดยืนยัน", "Edit before confirming")}</span></div>` : ""}
    <div class="sub">${L("ใช้ร่างโดยไม่แก้มาก", "Drafts used with little editing")}: <b>${stat}</b> · ${S.aiDrafts.length} ${L("ฉบับที่ยืนยันแล้ว", "confirmed drafts")}</div>`)}
  ${sec(L("AI-09 ถามข้อมูลจัดซื้อ", "AI-09 Ask about procurement data"), "AG-10", L("ตอบจากตัวชี้วัดที่นิยามไว้เท่านั้น พร้อมแหล่งที่มา ไม่คำนวณเอง", "Answers only from the defined KPIs, with the source. It doesn't calculate on its own."),
    `<div class="row"><input type="text" id="ai-q" value="${esc(AI_Q)}" placeholder="${L("เช่น มีผู้ยื่นรายเดียวกี่ส่วน", "For example: how often is there a single bidder?")}" style="flex:1 1 260px"><button class="btn" type="button" id="ai-09">${L("ถาม", "Ask")}</button></div>${res("a09")}`)}
  ${sec(L("AI-10 สรุปผลงานผู้ขาย", "AI-10 Supplier record summary"), "AG-10", L("สรุปจากข้อมูลที่ยืนยันแล้ว ไม่ตัดสินและไม่จัดอันดับผู้ขาย", "Summarises confirmed data. It does not judge or rank suppliers."),
    `<div class="row"><select id="ai-v" aria-label="${L("ผู้ขาย", "Supplier")}">${vendors.map(v => `<option>${esc(v)}</option>`).join("")}</select><button class="btn" type="button" id="ai-10" ${vendors.length ? "" : "disabled"}>${L("สรุป", "Summarise")}</button></div>${res("a10")}`)}`;
};

// ---------- actions ----------
function bindAI() {
  const c = () => caseOf($("#ai-case").value) || aiCases()[0], show = (k, html) => { AI_RES[k] = html; route(); };
  const sel = $("#ai-case"); if (sel) sel.onchange = () => { AI_CASE = sel.value; AI_RES = {}; route(); };
  const keep = () => { const t = $("#ai-tor"); if (t) AI_TOR = t.value; };
  const run = (id, name, fn) => { if (aiOff(id, name)) return; fn(); commit(); };
  const b01 = $("#ai-01"); if (b01) b01.onclick = () => run("AG-05", "Budget Monitoring Agent", () => { const r = aiConsolidate(); aiLog("AG-05", ["สแกนหารายการควรรวมซื้อและแตกซื้อ", "Scanned for items to combine and split purchases"], "PLAN", r.length);
    show("a01", r.length ? `<ul class="check">${r.map(x => `<li><span class="m ${x.over ? "no" : "wa"}">${x.over ? "!" : "~"}</span><div>${x.a.id} + ${x.b.id} · ${esc(tx(x.a.name))} / ${esc(tx(x.b.name))}<div class="sub">${L("คล้ายกัน", "similarity")} ${fmt(x.sim * 100)}% · ${x.same ? L("หน่วยเดียวกัน", "same unit") : L("ต่างหน่วย", "different units")} · ${L("รวม", "together")} ${fmt(x.total)} ${L("บาท", "baht")}${x.over ? ` · <b>${L("แต่ละรายการไม่เกินเพดาน แต่รวมเกิน เสนอรวมซื้อหรือชี้แจง (R-02)", "each is under the ceiling but together they pass it; consider combining or explaining (R-02)")}</b>` : ""}</div></div></li>`).join("")}</ul>` : `<span class="sub">${L("ไม่พบรายการที่ควรรวม", "Nothing to combine")}</span>`); });
  const b03 = $("#ai-03"); if (b03) b03.onclick = () => run("AG-07", "Procurement Drafting Agent", () => { const k = c(), r = aiRefPrice(k); aiLog("AG-07", ["เสนอราคากลางพร้อมหลักฐาน", "Suggested a reference price with evidence"], k.id, r.n);
    show("a03", r.n ? `<div>${L("ช่วงราคาที่เสนอ", "Suggested range")}: <b>${fmt(r.low)} – ${fmt(r.high)}</b> ${L("บาท", "baht")} · ${L("ค่ากลาง", "middle")} <b>${fmt(r.mid)}</b> <span class="sub">(${L("ประมาณการในแผน", "plan estimate")} ${fmt(r.est)})</span></div><div class="sub">${L("หลักฐาน (สัญญาชนิดเดียวกัน)", "Evidence (contracts of the same kind)")}: ${r.peers.map(x => `${x.id} ${fmt(x.rel * 100, 1)}%`).join(" · ")}</div><div class="sub">${L("ความมั่นใจ ต่ำ: ตัวอย่างน้อย ผู้ใช้ต้องตรวจและบันทึกเอง", "Low confidence: small sample, the user must check and record it")}</div>${isProcRole() && caseState(k) === 4 ? `<div class="row"><button class="btn primary" type="button" id="ai-03use" data-v="${r.mid}">${L("ยืนยันใช้ค่ากลางเป็นราคากลาง", "Confirm: use the middle value as the reference price")}</button></div>` : ""}` : `<span class="sub">${L("ยังไม่มีสัญญาเดิมชนิดเดียวกัน ใช้บัญชีราคามาตรฐานหรือใบเสนอราคา", "No past contract of this kind. Use the standard price list or quotations.")}</span>`); });
  const u03 = $("#ai-03use"); if (u03) u03.onclick = () => { const k = c(); k.ref = { amount: Number(u03.dataset.v), basis: ["contract"], note: `AI-03 ${AI_VER}, confirmed by ${userName(me().id)}`, by: me().id, t: nowIso() }; caseLog(k, "ref", `AI-03 ${fmt(k.ref.amount)}`); audit(["ยืนยันราคากลางที่ AI เสนอ", "Confirmed an AI-suggested reference price"], k.id); AI_RES = {}; commit(); renderShell(); route(); toast(L("บันทึกราคากลางแล้ว", "Reference price recorded")); };
  const b04 = $("#ai-04"); if (b04) b04.onclick = () => { keep(); run("AG-02", "Budget Validation Agent", () => { const k = c(), s = aiSpecCheck(AI_TOR), miss = caseChecks(k).filter(x => !x.ok); aiLog("AG-02", ["ตรวจ TOR และความครบถ้วนของแฟ้ม", "Checked a TOR and case completeness"], k.id, s.hits.length + miss.length);
    show("a04", `<div><b>${L("ข้อความ TOR", "TOR text")}</b></div>${AI_TOR.trim() ? (s.hits.length ? `<ul class="check">${s.hits.slice(0, 8).map(h => `<li><span class="m wa">!</span><div>“${esc(h.frag)}”<div class="sub">${tx(h.why)}</div></div></li>`).join("")}</ul><div class="sub">${s.equiv ? L("มีคำว่า “หรือเทียบเท่า” อยู่ในข้อความ", "The text contains “or equivalent”") : L("ไม่พบคำว่า “หรือเทียบเท่า” ควรเพิ่ม", "No “or equivalent” found; consider adding it")} · ${L("แจ้งคณะกรรมการก่อนส่ง", "tell the committee before it goes out")}</div>` : `<span class="sub">${L("ไม่พบข้อความที่ล็อกสเปก", "No spec-locking wording found")}</span>`) : `<span class="sub">${L("ยังไม่ได้วางข้อความ TOR", "No TOR text pasted")}</span>`}
      <div style="margin-top:6px"><b>${L("ความครบถ้วนของแฟ้มในขั้นนี้", "Case completeness for this step")}</b></div>${miss.length ? `<ul class="check">${miss.map(x => `<li><span class="m no">×</span><div>${esc(x.label)}</div></li>`).join("")}</ul>` : `<span class="sub">${L("ครบตามรายการตรวจของขั้นนี้", "Complete for this step")}</span>`}`); }); };
  const s04 = $("#ai-04s"); if (s04) s04.onclick = () => { AI_TOR = "ขอบเขตงาน: จัดหาเครื่องแม่ข่ายยี่ห้อ Dellon รุ่น PX-4420 เท่านั้น ติดตั้งภายใน 30 วัน"; route(); };
  const b05 = $("#ai-05"); if (b05) b05.onclick = () => run("AG-02", "Budget Validation Agent", () => { const k = c(), r = recommendMethod(k), docs = DOCS_BY_METHOD[r.method] || []; aiLog("AG-02", ["แนะนำวิธีจัดซื้อ", "Advised a procurement method"], k.id, 1);
    show("a05", r.method ? `<div>${L("วิธีที่แนะนำ", "Advised method")}: <b>${tx(PMETHOD[r.method])}</b> ${tag(`${L("กฎ", "Rule")} ${r.rule.id} · ${r.rule.conf}`, r.rule.conf === "A" ? "p-ok" : "p-info")}</div><div class="sub">${esc(tx(r.why))}</div><div class="sub">${L("เอกสารที่ต้องมี", "Documents needed")}: ${docs.map(d => tx(d)).join(" · ")}</div><div class="sub">${L("คำแนะนำเท่านั้น หัวหน้าพัสดุอนุมัติหากเลือกต่างออกไป", "Advice only; the head approves a different choice")}</div>` : `<span class="sub">${esc(tx(r.why))}</span>`); });
  $$("[data-ailtr]").forEach(b => (b.onclick = () => run("AG-08", "Contract Monitoring Agent", () => { const con = famCon(b.dataset.ailtr), k = caseByPlan(con.plan); aiLog("AG-08", ["ร่างหนังสือเร่งรัดการส่งมอบ", "Drafted a delivery reminder"], con.id, 1); AI_DOCT = "letter"; AI_CASE = k.id; AI_RES = { draft: aiDraft(k, "letter") }; route(); })));
  const dt = $("#ai-dt"); if (dt) dt.onchange = () => { AI_DOCT = dt.value; };
  const b02 = $("#ai-02"); if (b02) b02.onclick = () => { AI_DOCT = $("#ai-dt").value; run("AG-07", "Procurement Drafting Agent", () => { const k = c(); aiLog("AG-07", [`สร้าง${tx(DOC_T[AI_DOCT][0])}`, `Created a ${tx(DOC_T[AI_DOCT][0])}`], k.id, 1); AI_RES = { draft: aiDraft(k, AI_DOCT), orig: aiDraft(k, AI_DOCT) }; route(); }); };
  const use = $("#ai-use"); if (use) use.onclick = () => { const k = c(), fin = $("#ai-draft").value, orig = AI_RES.orig || aiDraft(k, AI_DOCT), ow = orig.split(/\s+/), fw = new Set(fin.split(/\s+/)), edit = ow.filter(w => !fw.has(w)).length / Math.max(1, ow.length);
    S.aiDrafts.unshift({ id: "AD-" + String(S.aiDrafts.length + 1).padStart(3, "0"), case: k.id, type: AI_DOCT, draft: orig, final: fin, by: me().id, t: nowIso(), edit: Math.round(edit * 100) / 100, ver: AI_VER });
    audit(["ยืนยันใช้ร่างจาก AI", "Confirmed an AI draft"], `${k.id} ${AI_DOCT} · แก้ ${Math.round(edit * 100)}%`); AI_RES = {}; commit(); route(); toast(L(`บันทึกแล้ว ส่วนที่แก้ ${Math.round(edit * 100)}%`, `Saved; ${Math.round(edit * 100)}% of the draft was edited`)); };
  const b09 = $("#ai-09"); if (b09) b09.onclick = () => { AI_Q = $("#ai-q").value; if (!AI_Q.trim()) return; run("AG-10", "Procurement Insight Agent", () => { const a = aiAnswer(AI_Q); aiLog("AG-10", a.ok ? ["ตอบคำถามข้อมูลจัดซื้อ", "Answered a procurement question"] : ["ปฏิเสธคำถามนอกขอบเขต", "Declined a question outside scope"], "PROC", a.src.length, a.ok);
    show("a09", a.ok ? `<b>${esc(a.text)}</b><div class="sub">${L("แหล่งที่มา", "Source")}: ${a.src.join(", ")} · n=${a.n} · ${esc(a.note)}</div>` : `<span style="color:var(--warn)">${esc(a.text)}</span>`); }); };
  const b10 = $("#ai-10"); if (b10) b10.onclick = () => run("AG-10", "Procurement Insight Agent", () => { const s = aiSupplier($("#ai-v").value); aiLog("AG-10", ["สรุปผลงานผู้ขาย", "Summarised a supplier record"], s.name, s.n);
    show("a10", `<div><b>${esc(s.name)}</b></div><div class="sub">${s.n} ${L("สัญญา", "contracts")} · ${mb(s.value)} ${L("ลบ.", "M")} · ${L("วันล่าช้ารวม", "late days")} ${s.late} · ${L("ค่าปรับ", "penalties")} ${fmt(s.pen)} ${L("บาท", "baht")} · ${L("ความเห็นแย้งตรวจรับ", "acceptance dissents")} ${s.dissent} · ${L("แก้ไขสัญญา", "contract changes")} ${s.vars}${s.closed.length ? ` · ${L("คะแนนหลังปิดงาน", "score after closing")} ${s.closed.join(", ")}/5` : ""}</div><div class="sub">${L("สรุปจากข้อมูลที่ยืนยันแล้ว ไม่ใช่การจัดอันดับ ใช้ประกอบการประเมินของเจ้าหน้าที่", "A summary of confirmed data, not a ranking. It supports the officer's own assessment.")}</div>`); });
}
{
  const base = BIND.procurement;
  BIND.procurement = () => { base(); if (PROC_TAB === "ai") bindAI(); };
}

/* ---- 99-boot.js ---- */
// Boot: pick the saved organization, load its state, draw the shell and the current page.
// With no signed-in session, the sign-in screen opens on top.
ORG = SEEDS[store.get("fisko-org")] ? store.get("fisko-org") : "sample";
load();
if (SESSION) { const su = S.users.find(u => u.id === SESSION.user); if (su) ROLE = su.role; }
bindShell();
renderShell();
route();
if (!SESSION) showSignIn();
</script>
