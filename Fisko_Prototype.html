<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fisko Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed navy rail + working canvas; every screen = summary strip, then the working table or form */
:root {
  --bg: #F4F5FA; --surface: #FFFFFF; --surface-2: #EEF0F7; --line: #DDDEE9;
  --ink: #1C1D3F; --ink-2: #45465C; --muted: #7A7B92;
  --rail: #1A1B50; --rail-2: #232366; --rail-ink: #C9CADF; --hl: #1A1B50;
  --accent: #1B9E29; --accent-2: #2AD03D; --accent-soft: #E4FBE7;
  --warn: #A86A0C; --warn-soft: #FCF1DB; --bad: #B9381D; --bad-soft: #FBE3DA;
  --info: #3A3B9A; --info-soft: #E6E7F7;
  --font: "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1029; --surface: #171939; --surface-2: #1F2147; --line: #2D2F5E;
  --ink: #ECEDF7; --ink-2: #C3C4D8; --muted: #8E90AE;
  --rail: #0A0B22; --rail-2: #1A1B50; --rail-ink: #B6B8D3; --hl: #24276A;
  --accent: #3DD552; --accent-2: #2AD03D; --accent-soft: #163A24;
  --warn: #E7AA45; --warn-soft: #3A2C12; --bad: #F2805F; --bad-soft: #42201A;
  --info: #A9ABF5; --info-soft: #262862; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1029; --surface: #171939; --surface-2: #1F2147; --line: #2D2F5E;
  --ink: #ECEDF7; --ink-2: #C3C4D8; --muted: #8E90AE;
  --rail: #0A0B22; --rail-2: #1A1B50; --rail-ink: #B6B8D3; --hl: #24276A;
  --accent: #3DD552; --accent-2: #2AD03D; --accent-soft: #163A24;
  --warn: #E7AA45; --warn-soft: #3A2C12; --bad: #F2805F; --bad-soft: #42201A;
  --info: #A9ABF5; --info-soft: #262862; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .86em; }

.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-2); display: grid; place-items: center; color: #10112B; font-weight: 700; font-family: var(--mono); font-size: 13px; }
.brand b { color: #fff; font-size: 16px; display: block; line-height: 1.2; }
.brand small { font-size: 11.5px; letter-spacing: .02em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-h { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7E80A8; padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--rail-ink); text-decoration: none; font-size: 14.5px; }
.nav a:hover { background: var(--rail-2); color: #fff; }
.nav a.on { background: var(--rail-2); color: #fff; box-shadow: inset 0 0 0 1px #3A3B77; }
.nav .code { font-family: var(--mono); font-size: 11px; color: #8A8CB5; width: 30px; }
.nav a.on .code { color: var(--accent-2); }
.nav .badge { margin-left: auto; background: var(--accent-2); color: #10112B; border-radius: 99px; font-size: 11.5px; font-weight: 700; padding: 0 7px; }
.rail-foot { margin-top: auto; font-size: 12px; color: #7E80A8; padding: 0 8px; line-height: 1.5; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 13px; color: var(--muted); }
.crumb b { color: var(--ink); font-weight: 600; }
.top .sp { flex: 1; }
.field-inline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
select, input[type="text"], input[type="number"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.6; }
.sample { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600; }

.view { padding-block: 26px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1360px; width: 100%; }
.head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
.head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.head .sp { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0F1029; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1029; } }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel > header h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel > header .sp { flex: 1; }
.panel .body { padding: 16px 18px; }
.sub { color: var(--muted); font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.kpi .d { font-size: 12.5px; }
.kpi.hl { background: var(--rail); border-color: var(--rail); color: #fff; }
.kpi.hl .l, .kpi.hl .v small { color: var(--rail-ink); }
.kpi.hl .v { color: var(--accent-2); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
.grid-form { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
tfoot td { font-weight: 700; background: var(--surface-2); }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--accent-soft); color: var(--accent); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-info { background: var(--info-soft); color: var(--info); }
.p-mute { background: var(--surface-2); color: var(--muted); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; min-width: 90px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 2px; }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

.alert { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.alert + .alert { margin-top: 10px; }
.alert .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-family: var(--mono); font-size: 12px; }
.alert b { display: block; font-size: 14px; }
.alert p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }

.hier { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.hier span { background: var(--surface-2); border-radius: 6px; padding: 3px 9px; color: var(--ink-2); }
.hier span:last-child { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hier em { color: var(--muted); font-style: normal; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.f .hint { font-size: 12px; color: var(--muted); }
.items input, .items select { width: 100%; padding: 6px 8px; }
.items input[type="number"] { text-align: right; }
.items td { padding: 6px 8px; }
.ai-draft { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }

.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.check li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.check .m { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 2px; }
.m.ok { background: var(--accent-soft); color: var(--accent); }
.m.no { background: var(--bad-soft); color: var(--bad); }
.m.wa { background: var(--warn-soft); color: var(--warn); }

.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding-bottom: 14px; position: relative; font-size: 13.5px; }
.timeline li::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin-top: 2px; }
.timeline li.done .dot { background: var(--accent); border-color: var(--accent); }
.timeline li.now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
/* Procurement case: the 12 states as a wrapping row of numbered chips */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.stepper li { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; color: var(--muted); background: var(--surface); }
.stepper .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.stepper li.done { color: var(--ink-2); }
.stepper li.done .dot, .stepper li.now .dot { background: var(--accent); color: #fff; }
.stepper li.now { border-color: var(--accent); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 3px var(--accent-soft); }
.timeline small { color: var(--muted); display: block; }

.ai-box { background: var(--rail); color: #fff; border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.ai-box h3 { margin: 0; font-size: 15px; color: var(--accent-2); }
.ai-box p { margin: 0; font-size: 13px; color: var(--rail-ink); }
.ai-box .btn { background: var(--rail-2); border-color: #3A3B77; color: #fff; justify-content: flex-start; }
.ai-box .btn:hover { border-color: var(--accent-2); }
.ai-out { font-size: 13px; background: #0F1030; border-radius: 8px; padding: 10px 12px; color: #E8E9F6; display: flex; flex-direction: column; gap: 6px; }
.ai-out li { margin-left: 16px; }
.ai-note { font-size: 11.5px; color: #8E90AE; }

.rounds input { width: 110px; text-align: right; }
.rounds input.changed { border-color: var(--warn); }
.delta { font-size: 12px; }
.delta.dn { color: var(--bad); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; max-height: 420px; overflow: auto; }
.log li { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.log li.new { border-left-color: var(--warn); }
.log small { color: var(--muted); display: block; }

.hbars { display: flex; flex-direction: column; gap: 12px; }
.hb { display: grid; grid-template-columns: 210px 1fr 90px; gap: 12px; align-items: center; font-size: 13.5px; }
.hb .track { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.hb .track i { display: block; height: 100%; }
.c1 { background: #1A1B50; } .c2 { background: #1B9E29; } .c3 { background: #6E73D6; } .c4 { background: #E2A93B; } .c5 { background: #9A9CB8; }
:root[data-theme="dark"] .c1 { background: #8C8FEA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .c1 { background: #8C8FEA; } }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.chat { display: flex; flex-direction: column; gap: 14px; min-height: 380px; }
.msg { max-width: 760px; padding: 12px 16px; border-radius: 12px; font-size: 14.5px; }
.msg.u { align-self: flex-end; background: var(--rail); color: #fff; border-bottom-right-radius: 4px; }
.msg.a { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.a h4 { margin: 10px 0 4px; font-size: 13px; color: var(--accent); letter-spacing: .02em; }
.msg.a ul, .msg.a ol { margin: 4px 0; padding-left: 20px; }
.msg.a table { font-size: 13px; margin: 6px 0; background: var(--surface); border-radius: 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.composer { display: flex; gap: 10px; }
.composer input { flex: 1; padding: 10px 14px; }

.toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--rail); color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 28px rgba(10, 11, 34, .28); display: flex; gap: 10px; align-items: center; z-index: 20; max-width: calc(100vw - 40px); }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); flex: none; }

.dupe { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dupe:last-child { border-bottom: 0; }
.dupe p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid2, .grid-form { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; }
  .nav-h, .rail-foot, .nav .code { display: none; }
  .nav a { white-space: nowrap; }
  .top { position: static; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .hb { grid-template-columns: minmax(0, 1fr) 80px; }
  .hb .track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }

/* ---- round 1 additions ---- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--rail); color: #fff; }
.iconbtn { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.iconbtn .cnt { position: absolute; top: -6px; right: -6px; background: var(--bad); color: #fff; border-radius: 99px; font-size: 11px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }
.npanel { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); top: 58px; width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(10, 11, 34, .22); z-index: 30; max-height: 70vh; overflow: auto; }
.npanel header { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); gap: 8px; }
.npanel header b { flex: 1; }
.nitem { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13.5px; }
.nitem:hover { background: var(--surface-2); }
.nitem i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: transparent; }
.nitem.unread i { background: var(--accent); }
.nitem small { color: var(--muted); display: block; }
.orgsel { max-width: 200px; }
#role { max-width: 190px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

.switch { position: relative; width: 38px; height: 22px; flex: none; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: background .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent-2); outline-offset: 2px; }

.tree-row td:first-child { white-space: nowrap; }

function buildOrg(cfg) {
  const s = Object.assign(sharedSeed(), cfg);
  const R = id => s.requests.find(r => r.id === id);
  const returned = s.requests.find(r => r.status === "returned");
  const inPlan = s.requests.filter(r => r.status === "plan");
  const worst = s.dash.units.slice().sort((a, b) => a.actual / a.plan - b.actual / b.plan)[0];
  const noMfa = s.users.find(u => !u.mfa);
  const story = R(s.story);

// My Workspace: what this role needs to do next, upcoming budget-calendar deadlines, notifications.
let CUR_REQ = null;
function openReq(id) { if (id !== CUR_REQ) { REQ_TAB = "main"; VER_A = VER_B = null; } CUR_REQ = id; go("request"); }
const cal = id => S.calendar.find(c => c.id === id) || { date: TODAY };
// Deep links used by tasks, the demo guide and notifications: "req:<id>", "<area>-<tab>" or a plain route.
const JUMP_TABS = {
  mon: ["dashboard", v => (MON_TAB = v)], alloc: ["allocation", v => (ALLOC_TAB = v)], rev: ["review", v => (REV_TAB = v)],
  perf: ["performance", v => (PERF_TAB = v)], sub: ["submission", v => (SUB_TAB = v)], cons: ["consolidation", v => (CONS_TAB = v)],
  intel: ["assistant", v => (INTEL_TAB = v)], strat: ["strategy", v => (STRAT_TAB = v)],
  prc: ["procurement", v => (PROC_TAB = v)], fnc: ["finance", v => (FIN_TAB = v)],
};
function jump(l) {
  if (l.startsWith("req:")) return openReq(l.slice(4));
  const [area, tab] = l.split("-");
  if (JUMP_TABS[area] && tab) { JUMP_TABS[area][1](tab); return go(JUMP_TABS[area][0]); }
  go(l);
}

    if (noRep.length) R(L("ส่งรายงานความก้าวหน้าประจำเดือน", "Send this month's progress report"), `${noRep.length} ${L("โครงการ", "projects")}`, "2026-10-20", "mon-progress", "p-warn");

    if (myK.length) R(L("บันทึกผลตัวชี้วัดกลางปี", "Enter mid-year KPI results"), myK.map(x => x.k.id).join(", "), "2026-10-31", "perf-kpis", "p-info");
    if (!t.length) R(L("ไม่มีงานค้าง", "Nothing waiting for you"), "", cal("c2").date, "requests", "p-mute");
  }
  if (ROLE === "plan") {
    S.requests.filter(r => r.status === "plan").forEach(r => R(`${L("กลั่นกรองคำขอ", "Review request")}: ${tx(r.name)}`, `${r.id} · ${unitName(r.unit)}`, cal("c3").date, `req:${r.id}`, "p-info"));
    const dup = S.dupes.filter(d => !d.done).length;
    if (dup) R(L(`ยืนยันรายการที่อาจซ้ำซ้อน ${dup} รายการ`, `Confirm ${dup} possible duplicates`), L("ตรวจพบโดย AI", "Found by AI"), cal("c3").date, "consolidation", "p-warn");
    R(L("เสนอวงเงินรอบที่ 2", "Propose round 2 amounts"), `${S.review.length} ${L("โครงการ", "projects")}`, cal("c3").date, "rev-rounds", "p-info");
    const sb = S.submission;
    if (sb.status === "preparing") R(L("เตรียมชุดคำขอส่งสำนักงบประมาณ", "Prepare the Budget Bureau package"), `${pkg().length} ${L("คำขอผ่านการเห็นชอบแล้ว", "requests approved so far")}`, cal("c6").date, "sub-checks", "p-info");
    if (sb.revisions.some(v => !v.closed)) R(L("ตอบคำขอปรับปรุงจากสำนักงบประมาณ", "Answer the Budget Bureau's revision requests"), "", sb.revisions.find(v => !v.closed).due, "sub-status", "p-bad");
    const noK = allKpis().filter(x => S.perf.kpis[x.k.id] && S.perf.kpis[x.k.id].result == null).length;
    if (noK) R(L("ติดตามผลตัวชี้วัดที่ยังไม่รายงาน", "Chase KPI results not yet reported"), `${noK} ${L("ตัวชี้วัด", "KPIs")}`, "2026-10-31", "perf-kpis", "p-warn");
    if (!S.perf.report || !S.perf.report.sent) R(L("จัดทำรายงานประเมินผลกลางปี", "Prepare the mid-year evaluation report"), "", "2026-11-15", "perf-report", "p-info");
  }
  if (ROLE === "exec") {
    S.requests.filter(r => r.status === "committee").forEach(r => R(`${L("พิจารณาในคณะกรรมการ", "Committee decision")}: ${tx(r.name)}`, `${r.id} · ${mb(r.amount)} ${L("ล้านบาท", "M baht")}`, cal("c4").date, "rev-meetings", "p-warn"));
    R(L("เห็นชอบวงเงินรอบที่ 3", "Approve round 3 amounts"), `${S.review.length} ${L("โครงการ", "projects")}`, cal("c5").date, "rev-rounds", "p-info");
    const trs = Object.values(S.allocs).flatMap(A => A.transfers.filter(x => x.status === "pending").map(x => ({ x, A })));
    trs.filter(({ x, A }) => { const a = A.lines.find(l => l.id === x.from), b = A.lines.find(l => l.id === x.to); return a.type !== b.type || a.unit !== b.unit; })
      .forEach(({ x }) => R(`${L("อนุมัติการโอนเปลี่ยนแปลง", "Approve budget transfer")} ${x.id}`, `${mb(x.amount)} ${L("ลบ.", "M")} · ${tx(x.why)}`, TODAY, "alloc-transfers", "p-warn"));
    R(L("ติดตามหน่วยงานที่เบิกจ่ายต่ำกว่าแผน", "Follow up units behind their spending plan"), "", TODAY, "mon-alerts", "p-bad");
    if (S.perf.report && S.perf.report.sent) R(L("อ่านรายงานประเมินผลกลางปี", "Read the mid-year evaluation report"), "", TODAY, "perf-report", "p-info");
  }
  // Round 8: project bank, plan revisions and ceiling responses.
  const ideas = S.ideas || [], resp = S.cons.resp || {};
  if (ROLE === "plan") {
    const nIdea = ideas.filter(i => i.status === "proposed").length;
    if (nIdea) R(L("กลั่นกรองแนวคิดโครงการในคลังโครงการ", "Screen project ideas in the project bank"), `${nIdea} ${L("แนวคิด", "ideas")}`, cal("c2").date, "strat-bank", "p-info");
    Object.keys(resp).filter(u => resp[u].st === "appeal").forEach(u => R(`${L("พิจารณาคำขอทบทวนกรอบวงเงิน", "Decide a ceiling appeal")}: ${unitName(u)}`, `${fmt(resp[u].amt, 1)} ${L("ลบ.", "M")} · ${tx(resp[u].why)}`, TODAY, "cons-responses", "p-warn"));
  }
  if (ROLE === "exec") (S.planRevs || []).filter(v => v.status === "pending").forEach(v => R(`${L("อนุมัติการทบทวนค่าเป้าหมาย", "Approve a target revision")} ${v.id}`, `${v.kpi} ${PLAN_YEARS[v.y]}: ${v.from} → ${v.to}`, TODAY, "strat-revise", "p-warn"));
  if (ROLE === "div") {

    if (resp[u] && resp[u].st === "pending") R(L("ตอบรับกรอบวงเงินของหน่วยงาน", "Reply to your unit ceiling"), `${fmt(S.cons.unitCeil[u], 1)} ${L("ล้านบาท", "M baht")}`, cal("c2").date, "requests", "p-warn");

  }
  // Round 9: hearings, parliament appeals, releases and carry-over.
  const H = S.hearings || [], C = S.carry || { prev: [], reqs: [] };
  if (ROLE === "div") H.filter(h => h.unit === me().unit && h.status !== "held" && openQs(h).length).forEach(h => R(`${L("ตอบคำถามการชี้แจงงบประมาณ", "Answer budget hearing questions")} ${h.id}`, `${openQs(h).length} ${L("ข้อ", "questions")} · ${L("ประชุม", "hearing")} ${fdate(h.date)}`, h.date, "requests", "p-warn"));
  if (ROLE === "plan") {
    const toCheck = H.flatMap(h => h.qs).filter(q => q.ans && q.ok == null).length;
    if (toCheck) R(L("ตรวจคำชี้แจงของหน่วยงาน", "Check units' hearing answers"), `${toCheck} ${L("ข้อ", "answers")}`, TODAY, "rev-hearings", "p-info");
    if (S.parl && S.parl.stage === 3) R(L("ยื่นแปรญัตติขอคืนงบประมาณที่ถูกปรับลด", "File appeals to restore cuts"), Object.keys(S.parl.cuts).join(", "), PARL_STEPS[3][1], "sub-parliament", "p-warn");
  }
  if (ROLE === "fin") {
    C.prev.filter(c => c.status === "open" && c.paid / c.amount < 0.5).forEach(c => R(`${L("เร่งเบิกจ่ายหรือขอขยายเวลาเงินกัน", "Speed up or extend carried funds")} ${c.id}`, `${L("เบิกแล้ว", "Paid")} ${fmt(c.paid / c.amount * 100, 0)}%`, c.due, "alloc-carry", "p-warn"));
    const A70 = S.allocs[2570];
    if (A70 && A70.releases && !A70.releases.some(r => r.q === 2 && r.type === "inv")) R(L("ขออนุมัติงวดเงินไตรมาส 2 งบลงทุน", "Request the Q2 investment release"), "", "2026-12-15", "alloc-releases", "p-info");
  }
  if (ROLE === "exec") [...C.prev.filter(c => c.status === "extension"), ...C.reqs.filter(c => c.status === "pending")].forEach(c => R(`${L("อนุมัติเรื่องเงินกันเหลื่อมปี", "Decide a carry-over")} ${c.id}`, mb(c.amount) + " " + L("ลบ.", "M"), TODAY, "alloc-carry", "p-warn"));
  // Round 10: anomalies, evaluations, procurement slippage.
  if (ROLE === "audit") (S.anoms || []).filter(a => a.status === "new").forEach(a => R(`${L("ตรวจรายการผิดปกติ", "Review an anomaly")} ${a.id}: ${tx(AN_KIND[a.kind])}`, `${unitName(a.unit)} · ${L("ความเสี่ยง", "risk")} ${a.risk}`, TODAY, "intel-anoms", a.risk >= 70 ? "p-bad" : "p-warn"));
  if (ROLE === "plan") (S.evals || []).filter(e => e.status === "draft").forEach(e => R(`${L("ประเมินโครงการให้เสร็จ", "Finish a project evaluation")} ${e.id}`, tx((evProj(e) || { name: "" }).name), "2026-11-30", "perf-evaluate", "p-info"));
  if (ROLE === "fin" && S.proc) { const late = Object.values(S.proc).filter(ms => procState(ms).lv !== "ok").length; if (late) R(L("ติดตามโครงการลงทุนที่จัดซื้อจัดจ้างล่าช้า", "Chase investment projects behind on procurement"), `${late} ${L("โครงการ", "projects")}`, TODAY, "mon-procure", "p-warn"); }
  famTasks(R);
  if (isProcRole() && !t.length) R(L("ไม่มีงานค้าง", "Nothing waiting for you"), "", TODAY, "procurement", "p-mute");
  // Delegated work (round 7): cross-unit transfers this user may approve on an executive's behalf.
  const dg = ROLE !== "exec" && delegFor("exec", "transfer");
  if (dg) Object.values(S.allocs).forEach(A => A.transfers.filter(x => x.status === "pending").forEach(x => { const a = A.lines.find(l => l.id === x.from), b = A.lines.find(l => l.id === x.to);

  if (ROLE === "fin") {
    const open = S.gfmis.filter(g => !g.ok).length;
    if (open) R(L("กระทบยอดผลเบิกจ่ายกับ GFMIS", "Reconcile disbursement with GFMIS"), `${open} ${L("รายการไม่ตรง", "rows differ")}`, TODAY, "mon-import", "p-warn");
    S.integrations.filter(i => i.status === "error").forEach(i => R(`${L("ตรวจสอบการเชื่อมต่อ", "Check integration")} ${i.id} · ${i.sys}`, tx(i.msg), TODAY, "admin-integrations", "p-bad"));
    Object.values(S.allocs).forEach(A => A.transfers.filter(x => x.status === "pending").forEach(x => { const a = A.lines.find(l => l.id === x.from), b = A.lines.find(l => l.id === x.to);
      if (a.type === b.type && a.unit === b.unit) R(`${L("อนุมัติการโอนภายในหน่วยงาน", "Approve in-unit transfer")} ${x.id}`, `${mb(x.amount)} ${L("ลบ.", "M")}`, TODAY, "alloc-transfers", "p-warn"); }));
    if (S.submission.status === "closed" && !S.allocs[2571]) R(L("สร้างร่างการจัดสรรปี 2571 จากผลพิจารณา", "Create the FY2571 draft allocation"), "", TODAY, "alloc-appropriation", "p-info");
    R(L("ทบทวนแผนการใช้จ่ายรายเดือน", "Review the monthly spending plan"), fyLabel(2570), TODAY, "alloc-plan", "p-mute");
  }
  if (ROLE === "audit") {
    R(L("ตรวจประวัติการปรับวงเงินระหว่างพิจารณา", "Check amount changes made in review"), `${S.log.length} ${L("เวอร์ชัน", "versions")}`, TODAY, "review", "p-info");
    R(L("ทบทวนบันทึกการใช้งานระบบ", "Review the audit log"), `${S.audit.length} ${L("รายการ", "entries")}`, TODAY, "admin-audit", "p-mute");
  }
  if (ROLE === "admin") {
    S.users.filter(x => !x.mfa).forEach(x => R(`${L("เปิด MFA ให้ผู้ใช้", "Turn on MFA for")} ${tx(x.name)}`, unitName(x.unit), TODAY, "admin-users", "p-bad"));

  }
  return t;
}

function dueText(iso) {
  const d = daysUntil(iso);
  if (d < 0) return `<span class="due" style="color:var(--bad)">${L("เลยกำหนด", "Overdue")} ${-d} ${L("วัน", "d")}</span>`;
  if (d === 0) return `<span class="due" style="color:var(--warn)">${L("วันนี้", "Today")}</span>`;
  return `<span class="due sub">${fdate(iso)} · ${L("อีก", "in")} ${d} ${L("วัน", "days")}</span>`;
}

// M07 Execution Monitoring: KPIs, plan vs actual curve, alerts and unit table, all derived from S.dash.
const PLAN_F = [0.05, 0.11, 0.18, 0.26, 0.35, 0.46, 0.6, 0.7, 0.79, 0.87, 0.94, 1];
const ACT_F = [0.035, 0.085, 0.14, 0.2, 0.29, 0.39, 0.52];
const FY_MONTHS = { th: ["ต.ค.", "พ.ย.", "ธ.ค.", "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย."], en: ["Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep"] };

function dashTotals() {
  const u = S.dash.units;
  const alloc = u.reduce((s, x) => s + x.alloc, 0), plan = u.reduce((s, x) => s + x.plan, 0), actual = u.reduce((s, x) => s + x.actual, 0);
  return { alloc, plan, actual, rate: actual / alloc * 100, prog: actual / plan * 100, left: alloc - actual };
}
function unitState(x) {
  const p = x.actual / x.plan * 100;
  return p < 70 ? [L("เสี่ยงสูง", "High risk"), "p-bad", p] : p < 90 ? [L("ต้องติดตาม", "Watch"), "p-warn", p] : [L("ตามแผน", "On track"), "p-ok", p];
}

function chartSVG(T) {
  const W = 720, H = 260, Lp = 54, R = 16, Tp = 16, B = 30, iw = W - Lp - R, ih = H - Tp - B;
  const max = Math.ceil(T.alloc / 250) * 250;
  const planS = PLAN_F.map(f => f * T.alloc), actS = ACT_F.map(f => f / ACT_F[6] * T.actual);
  const x = i => Lp + (iw / 11) * i, y = v => Tp + ih - (v / max) * ih;
  const line = a => a.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  let g = "";
  const step = max / 4;
  for (let v = 0; v <= max; v += step) g += `<line x1="${Lp}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${Lp - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  FY_MONTHS[LANG].forEach((m, i) => (g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${m}</text>`));
  const li = 6;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("แผนและผลการเบิกจ่ายสะสม ล้านบาท", "Cumulative plan and disbursement, million baht")}">${g}
    <path d="${line(actS)}L${x(li)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line(planS)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${line(actS)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${x(li)}" cy="${y(actS[li])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${x(li)}" cy="${y(planS[li])}" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
    <text x="${x(li) + 10}" y="${y(actS[li]) + 16}" style="fill:var(--accent);font-weight:600;font-size:12px">${L("ผล", "Actual")} ${fmt(actS[li])}</text>
    <text x="${x(li) - 10}" y="${y(planS[li]) - 9}" text-anchor="end" style="fill:var(--ink-2);font-weight:600;font-size:12px">${L("แผน", "Plan")} ${fmt(planS[li])}</text></svg>`;
}

  ope: [[["ค่าตอบแทน", "Allowances"], 0.1], [["ค่าใช้สอย", "Services"], 0.55], [["ค่าวัสดุ", "Materials"], 0.2], [["ค่าสาธารณูปโภค", "Utilities"], 0.15]],
  inv: [[["ค่าครุภัณฑ์", "Equipment"], 0.6], [["ค่าที่ดินและสิ่งก่อสร้าง", "Land and buildings"], 0.4]],
  sub: [[["เงินอุดหนุนทั่วไป", "General subsidies"], 1]], oth: [[["รายจ่ายอื่น", "Other"], 1]],
};
function miniCurve(alloc, plan, actual) {
  const W = 360, H = 120, P = 8, iw = W - 2 * P, ih = H - 2 * P - 14, x = i => P + iw / 11 * i, y = v => P + ih - v / alloc * ih;
  const ps = PLAN_F.map(f => f * alloc * (plan / (0.6 * alloc))), as = ACT_F.map(f => f / ACT_F[6] * actual);
  const line = a => a.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(Math.min(v, alloc)).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("แผนและผลสะสม", "Cumulative plan and actual")}"><line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <path d="${line(ps)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/><path d="${line(as)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${P}" y="${H - 2}">${FY_MONTHS[LANG][0]}</text><text x="${W - P}" y="${H - 2}" text-anchor="end">${FY_MONTHS[LANG][11]}</text></svg>`;
}

        <tbody>${ps.map(p => { const pr = S.progress[p.id]; return `<tr class="prog-row" data-dp="${p.id}" tabindex="0"><td>${esc(tx(p.name))}</td><td class="sub">${typeName(p.type)}</td><td class="n">${fmt(p.alloc, 1)}</td><td class="n">${fmt(p.plan, 1)}</td><td class="n">${fmt(p.actual, 1)}</td><td class="n">${stateCell(p.actual, p.plan)}</td><td>${pr ? tag(tx(PSTAT[pr.status][0]), PSTAT[pr.status][1]) : `<span class="sub">${L("ยังไม่รายงาน", "Not reported")}</span>`}</td></tr>`; }).join("")}</tbody></table></div>`;
    } else {
      const p = S.dash.projects.find(x => x.id === DRILL_P), sp = EXP_SPLIT[p.type], k = sp.map((s, i) => s[1] * (i === 0 ? 1.1 : 0.95)), ks = sumv(k), pr = S.progress[p.id];

          ${pr ? `<div class="alert"><div class="ic" style="background:var(--${pr.status === "risk" ? "bad" : pr.status === "delay" ? "warn" : "accent"}-soft);color:var(--${pr.status === "risk" ? "bad" : pr.status === "delay" ? "warn" : "accent"})">!</div><div><b>${tx(PSTAT[pr.status][0])} · ${L("ความก้าวหน้า", "progress")} ${pr.pct}%</b><p>${esc(tx(pr.issue))}</p></div></div>` : `<span class="sub">${L("ยังไม่มีรายงานความก้าวหน้า", "No progress report yet")}</span>`}</div></div>`;
    }
  }
  return `<section class="panel"><header><h2>${L("เจาะลึกผลการใช้จ่าย", "Spending drill-down")}</h2><span class="sp"></span><span class="sub">${L("ล้านบาท", "M baht")}</span></header>
    <div class="body hier" style="font-size:14px">${crumbs.join("<em>›</em>")}</div>${body}</section>`;

function monAlerts() {
  const out = [];

// M02 Budget Preparation: request list and request form. Checks read the M10 business rules;
// the approval route reads the M10 workflow.
const rule = id => S.rules.find(r => r.id === id);
// Equipment needs a specification; construction can use its drawings instead.
const SPEC_DOC = /คุณลักษณะ|spec|แบบรูป|แบบก่อสร้าง|drawing/i;
const editable = r => ROLE === "div" && r.unit === me().unit && (r.status === "draft" || r.status === "returned");
const itemTotal = it => (Number(it.qty) || 0) * (Number(it.price) || 0);

function lineage(actId) {
  const st = S.structure[2571] || [], out = [];
  let n = st.find(x => x.id === actId);
  while (n) { out.unshift(n); n = st.find(x => x.id === n.parent); }
  return out;
}

function checks(r) {
  const out = [], add = (ruleId, ok, title, okText, badText) => {
    const ru = ruleId ? rule(ruleId) : null;
    if (ru && !ru.on) return;
    const bad = ru ? (ru.effect === "block" ? "no" : "wa") : "no";
    out.push({ s: ok ? "ok" : bad, title, d: ok ? okText : badText, id: ruleId });
  };
  const reason = tx(r.reason).trim(), kpi = tx(r.kpi).trim();
  add("BR-01", !!r.act && !!kpi, L("ตัวชี้วัดและกิจกรรม", "KPI and activity"), L("ผูกกับกิจกรรมและตัวชี้วัดแล้ว", "Linked to an activity and KPI"), L("ยังไม่ระบุตัวชี้วัด", "No KPI yet"));
  const min = (rule("BR-02") || {}).param || 0;
  add("BR-02", reason.length >= min, L("เหตุผลความจำเป็น", "Justification"), L("กรอกครบ", "Complete"), `${L("ต้องมีอย่างน้อย", "Needs at least")} ${min} ${L("ตัวอักษร (ตอนนี้", "characters (now")} ${reason.length})`);
  add(null, r.items.length > 0 && r.items.every(i => tx(i.name).trim() && itemTotal(i) > 0), L("รายการงบประมาณ", "Budget lines"), L("ทุกรายการมีจำนวนและราคาต่อหน่วย", "Every line has a quantity and unit price"), L("มีรายการที่ยังไม่ครบ", "Some lines are incomplete"));
  add(null, r.docs.length > 0, L("เอกสารประกอบ", "Supporting documents"), `${r.docs.length} ${L("ไฟล์", "files")}`, L("ยังไม่มีเอกสารแนบ", "Nothing attached"));
  const inv = r.items.some(i => i.type === "inv"), spec = r.docs.some(d => SPEC_DOC.test(d));
  if (inv) add("BR-03", spec, L("คุณลักษณะเฉพาะครุภัณฑ์", "Equipment specification"), L("แนบแล้ว", "Attached"), L("มีงบลงทุน ต้องแนบคุณลักษณะเฉพาะ", "Investment lines need a specification"));
  if (r.prev > 0) {
    const d = (r.amount / r.prev - 1) * 100, lim = (rule("BR-04") || {}).param || 0;
    add("BR-04", d <= lim, L("เทียบปีก่อน", "Change from last year"), `${d >= 0 ? "+" : ""}${fmt(d, 1)}% ${L("จาก", "from")} ${mb(r.prev)} ${L("ล้านบาท", "M baht")}`, `${d >= 0 ? "+" : ""}${fmt(d, 1)}% ${L("เกินเกณฑ์", "is above")} ${lim}% ${L("· ต้องอธิบายส่วนเพิ่ม", "· explain the increase")}`);
  }
  const over = r.items.filter(i => {
    const nm = Array.isArray(i.name) ? i.name[0] : i.name;
    const sp = S.prices.find(p => p.name[0] === nm || p.name[1] === nm);
    return sp && Number(i.price) > sp.price;
  });
  add("BR-05", !over.length, L("ราคามาตรฐาน", "Standard prices"), L("ไม่เกินราคามาตรฐาน", "Within standard prices"), `${over.length} ${L("รายการสูงกว่าราคามาตรฐาน", "lines above the standard price")}`);
  add("BR-06", TODAY >= cal("c1").date && TODAY <= cal("c2").date, L("ช่วงเวลารับคำขอ", "Request window"), `${L("เปิดถึง", "Open until")} ${fdate(cal("c2").date)}`, L("อยู่นอกช่วงปฏิทินงบประมาณ", "Outside the budget calendar window"));
  if (r.multi && r.years) {
    const ys = Object.values(r.years).reduce((a, b) => a + Number(b || 0), 0);
    add(null, Math.abs(ys - r.amount) < 1, L("แบ่งวงเงินรายปี", "Multi-year split"), L("ผลรวมรายปีเท่ากับวงเงินรวม", "Yearly amounts add up to the total"), `${L("ผลรวมรายปี", "Yearly total")} ${fmt(ys)} ≠ ${fmt(r.amount)} · ${L("แก้ที่แท็บผูกพันหลายปี", "fix it in the Multi-year tab")}`);
  }
  if ((r.comments || []).length) {
    const open = openComments(r).length;
    add(null, !open, L("ความเห็นผู้พิจารณา", "Reviewer comments"), L("แก้ครบทุกข้อแล้ว", "All resolved"), `${L("ยังค้าง", "Still open:")} ${open} ${L("ข้อ", "")}`);

// M02 request form tabs (round 2): multi-year split, equipment detail, payroll estimate, versions.
let REQ_TAB = "main", VER_A = null, VER_B = null;
const nameKey = n => (Array.isArray(n) ? n[0] : n || "").trim();
function reqTabsBar(r) {
  const t = [["main", L("รายการและเหตุผล", "Lines and justification")], ["years", L("ผูกพันหลายปี", "Multi-year")]];
  if (r.items.some(i => i.type === "inv")) t.push(["equip", L("ครุภัณฑ์ / สิ่งก่อสร้าง", "Equipment & construction")]);
  if (r.items.some(i => i.type === "per") || r.payroll) t.push(["payroll", L("ประมาณการงบบุคลากร", "Payroll estimate")]);
  t.push(["versions", `${L("เวอร์ชัน", "Versions")} (${r.versions.length})`]);
  if (!t.find(x => x[0] === REQ_TAB)) REQ_TAB = "main";
  return `<div class="tabs" role="tablist">${t.map(([id, l]) => `<button class="tab ${id === REQ_TAB ? "on" : ""}" type="button" role="tab" aria-selected="${id === REQ_TAB}" data-rtab="${id}">${l}</button>`).join("")}</div>`;
}
// Record a new version when the budget lines changed since the last one (or always, when forced).
function snapshot(r, note, force) {
  const last = r.versions[r.versions.length - 1], items = JSON.parse(JSON.stringify(r.items));
  if (!force && last && JSON.stringify(last.items) === JSON.stringify(items)) return 0;
  const v = (last ? last.v : 0) + 1;
  r.versions.push({ v, t: nowIso(), by: me().id, note, items, amount: reqAmount(r) });
  VER_A = VER_B = null;
  return v;
}

// ---- versions ----
function diffItems(a, b) {
  const key = i => i.type + "|" + nameKey(i.name);
  const ma = new Map(a.items.map(i => [key(i), i])), mbm = new Map(b.items.map(i => [key(i), i]));
  const rows = [];
  b.items.forEach(i => { const o = ma.get(key(i)); rows.push({ s: !o ? "add" : (o.qty !== i.qty || o.price !== i.price) ? "chg" : "same", o, n: i }); });
  a.items.forEach(i => { if (!mbm.has(key(i))) rows.push({ s: "del", o: i, n: null }); });
  return rows;
}
REQ_PANELS.versions = r => {
  const V = r.versions, n = V.length;
  if (VER_A == null || VER_A >= n || (VER_A === VER_B && n > 1)) VER_A = Math.max(0, n - 2);
  if (VER_B == null || VER_B >= n || VER_A === VER_B) VER_B = n - 1;
  const a = V[VER_A], b = V[VER_B], rows = diffItems(a, b), d = b.amount - a.amount;
  const LBL = { add: [L("เพิ่ม", "Added"), "p-ok"], del: [L("ลบ", "Removed"), "p-bad"], chg: [L("เปลี่ยน", "Changed"), "p-warn"], same: [L("คงเดิม", "Same"), "p-mute"] };
  const sel = (id, cur) => `<select id="${id}" aria-label="${L("เวอร์ชัน", "Version")}">${V.map((v, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>v${v.v} · ${fdate(v.t)}</option>`).join("")}</select>`;
  return `<section class="panel"><header><h2>${L("ประวัติเวอร์ชัน", "Version history")}</h2><span class="sp"></span><span class="sub">${L("ทุกเวอร์ชันเก็บไว้ ไม่เขียนทับ", "Every version is kept; nothing is overwritten")}</span></header>
    <div class="tbl-wrap"><table><thead><tr><th>${L("เวอร์ชัน", "Version")}</th><th>${L("วันที่", "Date")}</th><th>${L("โดย", "By")}</th><th>${L("บันทึก", "Note")}</th><th class="n">${L("วงเงิน (บาท)", "Amount (baht)")}</th></tr></thead>
      <tbody>${V.slice().reverse().map(v => `<tr><td><b>v${v.v}</b></td><td class="sub">${fdate(v.t, true)}</td><td>${esc(userName(v.by))}</td><td>${esc(tx(v.note))}</td><td class="n">${fmt(v.amount)}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="panel"><header><h2>${L("เปรียบเทียบเวอร์ชัน", "Compare versions")}</h2><span class="sp"></span>${sel("ver-a", VER_A)}<span class="sub">→</span>${sel("ver-b", VER_B)}</header>
    <div class="body"><div class="row"><span>${L("วงเงินเปลี่ยน", "Amount change")}</span><b class="num" style="color:var(--${d > 0 ? "warn" : d < 0 ? "accent" : "ink"})">${d >= 0 ? "+" : ""}${fmt(d)} ${L("บาท", "baht")}</b>
      <span class="sub">(${fmt(a.amount)} → ${fmt(b.amount)})</span></div></div>
    <div class="tbl-wrap"><table class="vdiff"><thead><tr><th>${L("สถานะ", "Change")}</th><th>${L("รายการ", "Line")}</th><th class="n">${L("จำนวน", "Qty")}</th><th class="n">${L("ราคาต่อหน่วย", "Unit price")}</th><th class="n">${L("รวม", "Total")}</th></tr></thead>
      <tbody>${rows.map(x => { const it = x.n || x.o, cls = x.s === "same" ? "" : x.s;
        const cell = (k, f) => x.s === "chg" && x.o[k] !== x.n[k] ? `<span class="sub" style="text-decoration:line-through">${f(x.o[k])}</span> ${f(x.n[k])}` : f(it[k]);
        return `<tr><td class="${cls}">${tag(LBL[x.s][0], LBL[x.s][1])}</td><td class="${cls}">${esc(tx(it.name))}</td>
          <td class="n ${cls}">${cell("qty", v => fmt(v))}</td><td class="n ${cls}">${cell("price", v => fmt(v))}</td><td class="n ${cls}">${fmt(itemTotal(it))}</td></tr>`; }).join("")}</tbody></table></div></section>`;
};

const stdPrice = it => { const nm = Array.isArray(it.name) ? it.name : [it.name, it.name]; return S.prices.find(p => p.name.includes(nm[0]) || p.name.includes(nm[1])); };

// Picking a catalogue item fills in its budget type, unit and standard price.

// ---------- paste from Excel ----------
let PASTE_ROWS = [];
const PASTE_SAMPLE = () => L(
  "งบลงทุน\tเครื่องคอมพิวเตอร์โน้ตบุ๊ก\t10\tเครื่อง\t24000\nงบดำเนินงาน\tค่าอบรมต่อคน\t40\tคน\t2500\nงบดำเนินงาน\tค่าจ้างที่ปรึกษาต่อเดือน\t6\tคน-เดือน\tหกหมื่น",
  "Investment\tNotebook computer\t10\tunit\t24000\nOperating\tTraining per person\t40\tperson\t2500\nOperating\tConsultant per month\t6\tperson-month\tsixty thousand");
function typeFrom(v) {
  const s = String(v || "").trim().toLowerCase();
  const t = BUDGET_TYPES.find(b => b.code === s || b.id === s || b.name.some(n => n.toLowerCase() === s));
  return t ? t.id : null;
}
function parsePaste(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map((line, n) => {
    let c = line.split("\t").map(x => x.trim());
    if (c.length < 4) c = line.split(/\s{2,}|,/).map(x => x.trim()); // fallback for text without tabs
    let type = typeFrom(c[0]);
    if (type) c = c.slice(1); else type = null;
    const [name, qty, unit, price] = c, num = v => Number(String(v || "").replace(/[, ]/g, ""));
    const sp = stdPrice({ name: name || "" });
    const row = { n: n + 1, type: type || (sp ? sp.type : "ope"), name: name || "", qty: num(qty), unitName: unit || "", price: num(price), errs: [] };
    if (!row.name) row.errs.push(L("ไม่มีชื่อรายการ", "no item name"));
    if (!(row.qty > 0)) row.errs.push(L("จำนวนไม่ใช่ตัวเลข", "quantity is not a number"));
    if (!(row.price > 0)) row.errs.push(L("ราคาไม่ใช่ตัวเลข", "price is not a number"));
    if (!type && !sp) row.warn = L("ไม่ระบุงบรายจ่าย ใช้งบดำเนินงาน", "no budget type; using Operating");
    if (sp && row.price > sp.price) row.warn = `${L("เกินราคามาตรฐาน", "above standard price")} ${fmt(sp.price)}`;
    return row;
  });
}
function renderPaste() {
  const box = $("#paste-box"), ok = PASTE_ROWS.filter(r => !r.errs.length);
  box.innerHTML = `<div class="f"><label for="paste-in">${L("คัดลอกแถวจาก Excel แล้ววางที่นี่: งบรายจ่าย (ไม่บังคับ) · รายการ · จำนวน · หน่วยนับ · ราคาต่อหน่วย", "Copy rows from Excel and paste here: budget type (optional) · item · qty · unit · unit price")}</label>
      <textarea id="paste-in" rows="4" spellcheck="false" style="font-family:var(--mono);font-size:13px"></textarea></div>
    <div class="row"><button class="btn" type="button" id="paste-sample">${L("ใส่ข้อมูลตัวอย่าง", "Use sample rows")}</button><span class="sp"></span>
      <button class="btn ghost" type="button" id="paste-close">${L("ปิด", "Close")}</button>
      <button class="btn primary" type="button" id="paste-add" ${ok.length ? "" : "disabled"}>${L("เพิ่ม", "Add")} ${ok.length} ${L("รายการ", "lines")}</button></div>
    ${PASTE_ROWS.length ? `<div class="tbl-wrap"><table><thead><tr><th class="n">#</th><th>${L("งบรายจ่าย", "Type")}</th><th>${L("รายการ", "Item")}</th><th class="n">${L("จำนวน", "Qty")}</th><th>${L("หน่วยนับ", "Unit")}</th><th class="n">${L("ราคา", "Price")}</th><th>${L("ผลตรวจ", "Check")}</th></tr></thead>
      <tbody>${PASTE_ROWS.map(r => `<tr><td class="n">${r.n}</td><td class="sub">${typeName(r.type)}</td><td>${esc(r.name)}</td><td class="n">${r.qty > 0 ? fmt(r.qty) : "—"}</td><td class="sub">${esc(r.unitName)}</td><td class="n">${r.price > 0 ? fmt(r.price) : "—"}</td>
        <td>${r.errs.length ? tag(r.errs.join(", "), "p-bad") : r.warn ? tag(r.warn, "p-warn") : tag(L("พร้อมเพิ่ม", "Ready"), "p-ok")}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
}
function bindPaste(r) {
  const open = $("#paste-open"), box = $("#paste-box");
  if (!open || !box) return;
  const wire = text => {
    const inp = $("#paste-in"); inp.value = text || "";
    inp.oninput = () => { PASTE_ROWS = parsePaste(inp.value); const v = inp.value, pos = inp.selectionStart; renderPaste(); wire(v); $("#paste-in").focus(); $("#paste-in").setSelectionRange(pos, pos); };
    $("#paste-sample").onclick = () => { const s = PASTE_SAMPLE(); PASTE_ROWS = parsePaste(s); renderPaste(); wire(s); };
    $("#paste-close").onclick = () => { box.hidden = true; PASTE_ROWS = []; };
    $("#paste-add").onclick = () => {
      const ok = PASTE_ROWS.filter(x => !x.errs.length), skipped = PASTE_ROWS.length - ok.length;
      ok.forEach(x => r.items.push({ type: x.type, name: x.name, qty: x.qty, unitName: x.unitName, price: x.price }));
      // A multi-year request keeps its yearly split adding up: new lines are budgeted in the first year.
      const added = ok.reduce((s, x) => s + x.qty * x.price, 0), y0 = r.multi && r.years ? Object.keys(r.years).sort()[0] : null;
      if (y0) r.years[y0] = Number(r.years[y0] || 0) + added;
      r.items = r.items.filter(it => tx(it.name).trim() || itemTotal(it) > 0);
      audit(["วางรายการจาก Excel", "Pasted lines from Excel"], `${r.id} · ${ok.length}`);
      PASTE_ROWS = []; box.hidden = true; renderItems(); renderTimeline(); commit();
      toast(`${L("เพิ่มรายการแล้ว", "Lines added")} ${ok.length}${skipped ? ` · ${L("ข้ามแถวที่มีข้อผิดพลาด", "skipped rows with errors:")} ${skipped}` : ""}${y0 ? ` · ${L("เพิ่มวงเงินในปี", "added to FY")} ${y0}` : ""}`);
    };
  };
  open.onclick = () => { box.hidden = !box.hidden; if (!box.hidden) { PASTE_ROWS = []; renderPaste(); wire(""); $("#paste-in").focus(); } };
}

let IMP_R = "r2";

    const ratio = v.r0 ? Math.min(1, v[IMP_R] / v.r0) : 1;

    const kp = ks.map(k => { const t = k.targets[0], proj = k.base + (t - k.base) * ratio, short = t ? Math.max(0, 1 - proj / t) : 0; return { k, t, proj, short }; });

}

    ${Math.abs(gap) < 0.05 ? tag(L("รวมเท่ากับกรอบของกรม", "Matches the department ceiling"), "p-ok") : tag(`${gap > 0 ? L("เกินกรอบกรม", "Over the department ceiling by") : L("ต่ำกว่ากรอบกรม", "Under the department ceiling by")} ${fmt(Math.abs(gap), 1)}`, gap > 0 ? "p-bad" : "p-warn")}</header>
    <div class="tbl-wrap"><table><thead><tr><th>${L("หน่วยงาน", "Unit")}</th><th class="n">${L("คำขอ", "Requested")}</th><th class="n" style="width:150px">${L("กรอบวงเงิน", "Ceiling")}</th><th class="n">${L("ต้องปรับลด", "Cut needed")}</th><th>${L("สัดส่วนที่ได้", "Share kept")}</th></tr></thead>

    <div class="body row">${ed ? `<button class="btn" type="button" id="uc-prop">${L("แบ่งตามสัดส่วนคำขอ", "Split pro rata to requests")}</button>` : ""}
      <span class="sub">${L("กรอบวงเงินจะแจ้งหน่วยงานเพื่อปรับคำขอในรอบถัดไป", "Ceilings are sent to units so they can adjust their requests")}</span></div></section>`;
};
CONS_BIND.ceilings = () => {
  $$("[data-uc]").forEach(inp => (inp.onchange = () => { S.cons.unitCeil[inp.dataset.uc] = Number(inp.value); audit(["ปรับกรอบวงเงินหน่วยงาน", "Changed a unit ceiling"], `${unitName(inp.dataset.uc)}: ${inp.value}`); commit(); route(); }));

    notify(["div"], ["กองแผนงานแจ้งกรอบวงเงินรายหน่วยงานแล้ว", "Planning has issued unit budget ceilings"], "requests");
    commit(); route(); toast(L("แบ่งกรอบวงเงินแล้ว และแจ้งหน่วยงาน", "Ceilings split and units notified"));

};

    <div class="tbl-wrap"><table><thead><tr><th>${L("แผนงาน", "Programme")}</th><th class="n">${L("คำขอ", "Requests")}</th><th class="n">${L("ปี 2570", "FY2570")}</th><th class="n">${L("ปี 2571", "FY2571")}</th><th class="n">${L("เปลี่ยนแปลง", "Change")}</th><th class="n">${L("สัดส่วน", "Share")}</th></tr></thead>

          <td class="n">${ch == null ? "—" : `${ch >= 0 ? "+" : ""}${fmt(ch, 1)}%`}</td><td class="n">${fmt(tot ? x.amt / tot * 100 : 0, 1)}%</td></tr>
          ${open ? x.rq.map(r => `<tr class="sub-row"><td><a href="#" data-req="${r.id}" class="mono">${r.id}</a> ${esc(tx(r.name))}</td><td class="n">${pill(r.status)}</td><td class="n">${mb(r.prev || 0)}</td><td class="n">${mb(r.amount)}</td><td class="n"></td><td class="n"></td></tr>`).join("") || `<tr class="sub-row"><td colspan="6" class="sub">${L("ไม่มีคำขอ", "No requests")}</td></tr>` : ""}`; }).join("")}
        ${none.length ? `<tr><td class="sub">${L("ยังไม่ระบุกิจกรรม", "No activity chosen")}</td><td class="n">${none.length}</td><td></td><td class="n">${mb(none.reduce((s, r) => s + r.amount, 0))}</td><td></td><td></td></tr>` : ""}</tbody>
      <tfoot><tr><td>${L("รวม", "Total")}</td><td class="n">${S.requests.length}</td><td class="n">${mb(rows.reduce((s, x) => s + x.prev, 0))}</td><td class="n">${mb(tot)}</td><td></td><td class="n">100%</td></tr></tfoot></table></div></section>`;
};
CONS_BIND.programme = () => {

// M03 deeper features (round 8): unit responses to the issued ceilings (accept, or appeal with an
// amount and reason that Planning grants or declines) and 4-year forward estimates.
const CRESP = { pending: [["รอตอบรับ", "Awaiting reply"], "p-mute"], accepted: [["ยอมรับกรอบ", "Accepted"], "p-ok"], appeal: [["ขอทบทวน", "Appealed"], "p-warn"],
  granted: [["อนุมัติเพิ่มกรอบ", "Appeal granted"], "p-info"], declined: [["คงกรอบเดิม", "Appeal declined"], "p-bad"] };
const sumV = a => a.reduce((x, y) => x + y, 0);
const consResp = unit => (S.cons.resp && S.cons.resp[unit]) || { st: "pending" };

CONS_PANELS.responses = () => {
  const pl = ROLE === "plan", rows = S.cons.units.map(u => ({ u, req: sumV(u.v), ceil: S.cons.unitCeil[u.unit], r: consResp(u.unit) }));
  const cnt = st => rows.filter(x => x.r.st === st).length, tCeil = sumV(rows.map(x => x.ceil)), asked = sumV(rows.filter(x => x.r.st === "appeal").map(x => x.r.amt));

  <section class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <div class="kpi"><span class="l">${L("แจ้งกรอบวงเงินเมื่อ", "Ceilings issued")}</span><span class="v" style="font-size:20px">${S.cons.issued ? fdate(S.cons.issued) : "—"}</span></div>
    <div class="kpi"><span class="l">${L("ยอมรับกรอบแล้ว", "Accepted")}</span><span class="v">${cnt("accepted")}<small>/ ${rows.length}</small></span></div>
    <div class="kpi"><span class="l">${L("ขอทบทวนรอพิจารณา", "Appeals to decide")}</span><span class="v" style="color:var(--${cnt("appeal") ? "warn" : "accent"})">${cnt("appeal")}</span>${asked ? `<span class="d">${fmt(asked, 1)} ${L("ลบ.", "M")}</span>` : ""}</div>

  </section>

    <div class="tbl-wrap"><table><thead><tr><th>${L("หน่วยงาน", "Unit")}</th><th class="n">${L("คำขอ", "Requested")}</th><th class="n">${L("กรอบ", "Ceiling")}</th><th>${L("การตอบรับ", "Response")}</th><th class="n">${L("ขอเพิ่ม (ลบ.)", "Asked (M)")}</th><th>${L("เหตุผล", "Reason")}</th><th></th></tr></thead>
      <tbody>${rows.map(x => `<tr><td>${unitName(x.u.unit)}</td><td class="n">${fmt(x.req, 1)}</td><td class="n">${fmt(x.ceil, 1)}</td>

        <td class="n">${x.r.amt ? fmt(x.r.amt, 1) : "—"}</td><td class="sub">${x.r.why ? esc(tx(x.r.why)) : "—"}${x.r.note ? `<div>${L("ผลพิจารณา", "Decision")}: ${esc(tx(x.r.note))}</div>` : ""}</td>
        <td><div class="row" style="flex-wrap:nowrap">${pl && x.r.st === "appeal" ? `<button class="btn primary" type="button" data-cgrant="${x.u.unit}">${L("เพิ่มกรอบให้", "Grant")}</button><button class="btn danger" type="button" data-cdecl="${x.u.unit}">${L("คงกรอบเดิม", "Decline")}</button>` : ""}

    ${pl ? `<div class="body sub">${L("การเพิ่มกรอบให้หน่วยหนึ่งทำให้กรอบรวมเกินกรอบกรม ให้ปรับลดหน่วยอื่นที่แท็บกรอบวงเงินรายหน่วยงาน", "Granting an appeal can push the total over the department ceiling; rebalance other units in the Unit ceilings tab")}</div>` : ""}</section>`;
};
CONS_BIND.responses = () => {
  const decide = (unit, ok) => {
    const r = consResp(unit), n = unitName(unit);
    if (ok) S.cons.unitCeil[unit] = Math.round((S.cons.unitCeil[unit] + r.amt) * 10) / 10;
    r.st = ok ? "granted" : "declined"; r.dt = nowIso(); r.note = ok ? ["เพิ่มกรอบตามที่ขอ", "Raised as asked"] : ["กรอบรวมของกรมไม่พอ ให้ปรับลำดับความสำคัญภายในหน่วย", "No room in the department total; reprioritise within the unit"];
    audit(ok ? ["อนุมัติคำขอทบทวนกรอบวงเงิน", "Granted a ceiling appeal"] : ["ไม่อนุมัติคำขอทบทวนกรอบวงเงิน", "Declined a ceiling appeal"], `${n} · ${fmt(r.amt, 1)} M`);
    notify(["div"], ok ? [`กองแผนงานเพิ่มกรอบวงเงิน ${n} อีก ${fmt(r.amt, 1)} ล้านบาท`, `Planning raised the ${n} ceiling by ${fmt(r.amt, 1)} M`] : [`กองแผนงานคงกรอบวงเงินเดิมของ ${n}`, `Planning kept the ${n} ceiling unchanged`], "requests");
    commit(); route(); toast(ok ? L("เพิ่มกรอบแล้ว · ตรวจกรอบรวมที่แท็บกรอบวงเงิน", "Granted · check the total in Unit ceilings") : L("คงกรอบเดิม · แจ้งหน่วยงานแล้ว", "Declined · the unit has been told"));
  };
  $$("[data-cgrant]").forEach(b => (b.onclick = () => decide(b.dataset.cgrant, true)));
  $$("[data-cdecl]").forEach(b => (b.onclick = () => decide(b.dataset.cdecl, false)));
  $$("[data-cremind]").forEach(b => (b.onclick = () => {
    notify(["div"], [`กรุณาตอบรับกรอบวงเงินของ ${unitName(b.dataset.cremind)}`, `Please reply to the ${unitName(b.dataset.cremind)} ceiling`], "requests");
    audit(["แจ้งเตือนให้ตอบรับกรอบวงเงิน", "Reminded a unit to reply to its ceiling"], unitName(b.dataset.cremind)); commit(); toast(L("ส่งแจ้งเตือนแล้ว", "Reminder sent"));
  }));
};

// Shown to a division on its M02 request list once ceilings are issued.

  const r = consResp(u.unit), req = sumV(u.v), ceil = S.cons.unitCeil[u.unit];
  return `<section class="panel" id="ceil-panel"><header><h2>${L("กรอบวงเงินของหน่วยงาน ปี 2571", "Your FY2571 ceiling")}</h2><span class="sp"></span>${tag(tx(CRESP[r.st][0]), CRESP[r.st][1])}</header>
    <div class="body" style="display:flex;flex-direction:column;gap:10px">
      <div class="row"><span>${L("คำขอรวม", "Requested")} <b class="num">${fmt(req, 1)}</b></span><span>·</span><span>${L("กรอบที่ได้รับ", "Ceiling")} <b class="num">${fmt(ceil, 1)}</b> ${L("ล้านบาท", "M baht")}</span>
        ${req > ceil ? `<span>·</span><span style="color:var(--bad)">${L("ต้องปรับลด", "To cut")} ${fmt(req - ceil, 1)}</span>` : ""}<span class="sub">${L("แจ้งเมื่อ", "Issued")} ${fdate(S.cons.issued)}</span></div>
      ${r.st === "pending" ? `<div class="row"><button class="btn primary" type="button" id="ceil-ok">${L("ยอมรับกรอบวงเงิน", "Accept the ceiling")}</button><button class="btn" type="button" id="ceil-appeal">${L("ขอทบทวนกรอบ", "Appeal")}</button></div>
        <form class="inline-form" id="ceil-form" hidden><div class="f" style="flex:0 1 140px"><label for="ceil-amt">${L("ขอเพิ่ม (ล้านบาท)", "Extra (M baht)")}</label><input type="number" id="ceil-amt" min="0.1" step="0.1" required></div>
          <div class="f" style="flex:2 1 240px"><label for="ceil-why">${L("เหตุผลและผลกระทบหากไม่ได้รับ", "Reason and impact if not granted")}</label><input type="text" id="ceil-why" required></div>
          <button class="btn primary" type="submit">${L("ส่งคำขอทบทวน", "Send appeal")}</button></form>`
        : r.st === "appeal" ? `<span class="sub">${L("ขอเพิ่ม", "Asked for")} ${fmt(r.amt, 1)} ${L("ลบ. · รอกองแผนงานพิจารณา", "M · waiting for Planning")}</span>`
        : r.note ? `<span class="sub">${esc(tx(r.note))}</span>` : ""}</div></section>`;
}
function bindCeilingBanner() {

// ---- what-if ----
function simulate() {
  const rs = S.requests.filter(r => r.status !== "rejected");
  if (!WI.locks) WI.locks = new Set(rs.filter(r => isPersonnel(r) || r.id === S.story).map(r => r.id));
  const total = sumv(rs.map(r => r.amount)), target = total * (1 - WI.cut / 100);
  const locked = rs.filter(r => WI.locks.has(r.id) || isPersonnel(r)), flex = rs.filter(r => !locked.includes(r));
  let need = total - target; const out = {};
  rs.forEach(r => (out[r.id] = r.amount));
  for (let pass = 0; pass < 4 && need > 1; pass++) {
    const open = flex.filter(r => out[r.id] > r.amount * 0.2 + 1);
    const W = sumv(open.map(r => (110 - scoreOf(r)) * out[r.id])); if (!W) break;
    let cutDone = 0;
    open.forEach(r => { const want = need * (110 - scoreOf(r)) * out[r.id] / W, can = out[r.id] - r.amount * 0.2, c = Math.min(want, can); out[r.id] -= c; cutDone += c; });
    need -= cutDone;
  }
  return { rs, total, target, out, short: Math.max(0, need), locked };
}

// ---- justification quality ----
function jqScore(r) {
  const t = tx(r.reason).trim(), min = (rule("BR-02") || {}).param || 0;
  const c = [
    [t.length >= min, 25, L(`ยาวไม่น้อยกว่า ${min} ตัวอักษร`, `At least ${min} characters`), L("ขยายความให้ครบ ปัญหา ความจำเป็น และผลที่ได้", "Say more: the problem, the need and the result")],
    [/ปัญหา|เนื่องจาก|ปัจจุบัน|problem|because|currently/i.test(t), 20, L("ระบุปัญหาหรือสภาพปัจจุบัน", "States the problem"), L("เริ่มด้วยปัญหาหรือสภาพปัจจุบันที่ต้องแก้", "Open with the problem or current situation")],
    [/ประชาชน|ผู้รับบริการ|ผู้ใช้|ชุมชน|citizen|user|communit|people/i.test(t), 20, L("ระบุกลุ่มเป้าหมายผู้ได้รับประโยชน์", "Names who benefits"), L("ระบุว่าใครได้ประโยชน์และกี่คน", "Say who benefits and how many")],
    [/\d/.test(t), 20, L("มีตัวเลขเชิงปริมาณ", "Uses numbers"), L("ใส่ตัวเลข เช่น จำนวนผู้รับบริการ เวลาที่ลดลง", "Add numbers, e.g. people served or time saved")],
    [!!tx(r.kpi).trim() || kpisForAct(r.act).length > 0, 15, L("เชื่อมกับตัวชี้วัด", "Linked to a KPI"), L("ผูกกับตัวชี้วัดใน M01", "Link it to an M01 KPI")],
  ];
  return { score: c.reduce((s, x) => s + (x[0] ? x[1] : 0), 0), c };
}

  add(lin.length > 0 && lin[0].lvl === "program", false, L("โครงสร้างแผนงาน", "Programme structure"), L("ไม่อยู่ใต้แผนงาน", "Not under a programme"));
  add(isPersonnel(r) || kpisForAct(r.act).length > 0, true, L("ตัวชี้วัด (M01)", "KPI (M01)"), L("ยังไม่ผูกตัวชี้วัด", "No KPI linked"));
  add(r.items.length && r.items.every(i => i.type && itemTotal(i) > 0), false, L("งบรายจ่าย", "Budget types"), L("มีรายการไม่ครบ", "Incomplete lines"));
  const ys = r.multi && r.years ? Object.values(r.years).reduce((a, b) => a + Number(b || 0), 0) : r.amount;
  add(!r.multi || Math.abs(ys - r.amount) < 1, false, L("ผูกพันหลายปี", "Multi-year"), L("ผลรวมรายปีไม่ตรง", "Years don't add up"));
  const inv = r.items.some(i => i.type === "inv"), spec = r.docs.some(d => SPEC_DOC.test(d));
  add(r.docs.length > 0 && (!inv || spec), false, L("เอกสารประกอบ", "Documents"), L("ขาดเอกสาร", "Missing documents"));
  add(r.decided == null || Math.abs(r.decided - r.amount) < 1, true, L("วงเงินตามมติ", "Resolved amount"), `${L("ใช้วงเงินตามมติ", "Uses the resolved amount")} ${mb(r.decided || 0)} ${L("ลบ.", "M")}`);
  return out;
}

        <td>${v.closed ? tag(L("ตอบแล้ว", "Answered"), "p-ok") : ed ? `<button class="btn" type="button" data-rvclose="${i}">${L("ส่งคำตอบ", "Send reply")}</button>` : tag(L("รอตอบ", "Open"), "p-warn")}</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;

BIND.submission = () => {
  const sb = S.submission;
  $$("[data-sbtab]").forEach(b => (b.onclick = () => { SUB_TAB = b.dataset.sbtab; route(); }));
  $$("[data-req]").forEach(a => (a.onclick = e => { e.preventDefault(); openReq(a.dataset.req); }));
  $$("[data-exp]").forEach(b => (b.onclick = () => {
    const k = b.dataset.exp, n = sb.exports.length + 1;
    const file = k === "xlsx" ? `FY2571_requests_summary_${n}.xlsx` : k === "pdf" ? `FY2571_request_form_${n}.pdf` : `FY2571_budget_exchange_${n}.xml`;
    sb.exports.push({ t: nowIso(), by: me().id, kind: k, file, count: pkg().length });
    audit(["ส่งออกไฟล์คำของบประมาณ", "Exported a request file"], file); commit(); route();
    toast(L(`สร้างไฟล์ ${file} แล้ว (จำลอง)`, `Created ${file} (simulated)`));
  }));
  const send = $("#sub-send");
  if (send) send.onclick = () => {
    const P = pkg(), id = `SUB-2571-${String(sb.batches.length + 1).padStart(2, "0")}`;
    const ch = S.integrations.find(i => i.id === "IF-01");
    sb.batches.push({ id, t: nowIso(), by: me().id, count: P.length, amount: P.reduce((s, r) => s + subAmt(r), 0), method: ch && ch.status === "ok" ? ["ส่งผ่านช่องทาง IF-01", "Sent through IF-01"] : ["ส่งเป็นไฟล์ตามรูปแบบที่กำหนด", "Sent as a file in the prescribed format"] });
    P.forEach(r => (r.sub = id));
    sb.status = "submitted";
    audit(["ส่งชุดคำของบประมาณถึงสำนักงบประมาณ", "Sent the request package to the Budget Bureau"], `${id} · ${P.length}`);
    notify(["exec", "plan"], [`ส่งคำของบประมาณ ${id} ถึงสำนักงบประมาณแล้ว`, `Request package ${id} sent to the Budget Bureau`], "submission");
    commit(); route(); toast(L("ส่งชุดข้อมูลแล้ว", "Package sent"));
  };
  const s1 = $("#sub-sim1"); if (s1) s1.onclick = () => { sb.status = "reviewing"; audit(["บันทึกสถานะ: สำนักงบประมาณเริ่มพิจารณา", "Status: Budget Bureau review started"], "M05"); commit(); route(); };
  const s2 = $("#sub-sim2");
  if (s2) s2.onclick = () => {
    const b = sb.batches[sb.batches.length - 1], rs = S.requests.filter(r => r.sub === b.id);
    rs.forEach(r => (sb.results[r.id] = isPersonnel(r) ? subAmt(r) : Math.round(subAmt(r) * 0.92 / 1e5) * 1e5));
    const target = rs.find(r => r.id === S.story) || rs.find(r => r.items.some(i => i.type === "inv")) || rs[0];
    if (target) sb.revisions.push({ req: target.id, issue: ["ขอรายละเอียดราคากลางและแบบรูปรายการเพิ่มเติม", "Send the standard-price breakdown and detailed drawings"], due: addDays(TODAY, 14), closed: false, reply: "" });
    sb.status = "result";
    audit(["บันทึกผลพิจารณาจากสำนักงบประมาณ", "Recorded the Budget Bureau result"], b.id);
    notify(["plan", "exec", "fin"], ["ได้รับผลพิจารณาคำของบประมาณจากสำนักงบประมาณแล้ว", "The Budget Bureau's result has arrived"], "submission");
    commit(); renderShell(); route();
  };
  $$("[data-resamt]").forEach(inp => (inp.onchange = () => { sb.results[inp.dataset.resamt] = Number(inp.value) * 1e6; audit(["แก้ไขผลพิจารณา", "Edited a result"], inp.dataset.resamt); commit(); route(); }));

    audit(["ตอบคำขอปรับปรุงจากสำนักงบประมาณ", "Answered a Budget Bureau revision request"], v.req); commit(); route();
  }));
  const cl = $("#sub-close");
  if (cl) cl.onclick = () => {
    sb.status = "closed";

    notify(["fin"], ["ผลพิจารณางบประมาณพร้อมสำหรับการจัดสรร (M06)", "Budget results are ready for allocation (M06)"], "allocation");
    commit(); route(); toast(L("ส่งต่อการจัดสรรแล้ว · โมดูล M06 อยู่ในรอบที่ 4", "Handed to allocation · M06 arrives in round 4"));

BIND.allocation = () => {
  const A = AL(), re = () => { commit(); route(); };
  $$("[data-atab]").forEach(b => (b.onclick = () => { ALLOC_TAB = b.dataset.atab; route(); }));
  $$("[data-fy]").forEach(b => (b.onclick = () => { ALLOC_FY = Number(b.dataset.fy); route(); }));
  const mk = $("#mk-2571");
  if (mk) mk.onclick = () => {
    const rs = S.requests.filter(r => S.submission.results[r.id] != null);
    const lines = rs.map((r, i) => {
      const by = {}; r.items.forEach(it => (by[it.type] = (by[it.type] || 0) + itemTotal(it)));
      const type = Object.keys(by).sort((a, b) => by[b] - by[a])[0], amount = S.submission.results[r.id];
      return { id: "N" + (i + 1), unit: r.unit, name: r.name, type, amount, act: r.act, plan: monthShape(type).map(f => Math.round(amount * f)) };
    });
    lines.forEach(l => (l.plan[11] += l.amount - sumv(l.plan)));
    const byType = {}; BUDGET_TYPES.forEach(t => (byType[t.id] = sumv(lines.filter(l => l.type === t.id).map(l => l.amount))));
    S.allocs[2571] = { fy: 2571, draft: true, act: ["ร่างการจัดสรรปี 2571 จากผลพิจารณาของสำนักงบประมาณ", "FY2571 draft allocation from the Budget Bureau result"], date: TODAY, total: sumv(lines.map(l => l.amount)), byType, lines, transfers: [] };
    ALLOC_FY = 2571;
    audit(["สร้างร่างการจัดสรรปี 2571 จากผลพิจารณา", "Created the FY2571 draft allocation from the result"], `${lines.length} ${L("รายการ", "lines")}`); re();
    toast(L("สร้างร่างการจัดสรรปี 2571 แล้ว", "FY2571 draft allocation created"));
  };
  $$("[data-unit]").forEach(tr => { const t = () => { const u = tr.dataset.unit; OPEN_UNIT.has(u) ? OPEN_UNIT.delete(u) : OPEN_UNIT.add(u); route(); };
    tr.onclick = e => { if (!e.target.closest("input")) t(); }; tr.onkeydown = e => { if (e.key === "Enter") t(); }; });
  $$("[data-lamt]").forEach(inp => (inp.onchange = () => {
    const l = lineOf(inp.dataset.lamt), nv = Math.round(Number(inp.value) * 1e6), room = (A.byType[l.type] || 0) - allocated(l.type) + l.amount;
    if (nv > room) { toast(L(`เกินวงเงิน${typeName(l.type)}ที่เหลือ (${mb(room)} ลบ.)`, `More than the ${typeName(l.type)} left (${mb(room)} M)`)); inp.value = (l.amount / 1e6).toFixed(2); return; }
    audit(["ปรับวงเงินจัดสรร", "Changed an allocation"], `${l.id}: ${mb(l.amount)} → ${mb(nv)}`);
    l.amount = nv; scalePlan(l, nv); re();
  }));
  const af = $("#al-form");
  if (af) af.onsubmit = e => {
    e.preventDefault();
    const type = $("#al-type").value, amount = Math.round(Number($("#al-amt").value) * 1e6), room = (A.byType[type] || 0) - allocated(type);
    if (amount > room) { toast(L(`เกินวงเงิน${typeName(type)}ที่ยังไม่จัดสรร (${mb(room)} ลบ.)`, `More than the unallocated ${typeName(type)} (${mb(room)} M)`)); return; }
    const nm = $("#al-name").value.trim(), unit = $("#al-unit").value;
    const l = { id: "L" + (A.lines.length + 1), unit, name: [nm, nm], type, amount, act: "", plan: monthShape(type).map(f => Math.round(amount * f)) };
    l.plan[11] += amount - sumv(l.plan); A.lines.push(l); OPEN_UNIT.add(unit);
    audit(["จัดสรรงบประมาณ", "Allocated budget"], `${unitName(unit)} · ${nm} · ${mb(amount)}`);
    notify(["div"], [`กองคลังจัดสรรงบประมาณ ${nm} ${mb(amount)} ลบ.`, `Finance allocated ${mb(amount)} M for ${nm}`], "allocation"); re();
  };
  const pu = $("#pu"); if (pu) pu.onchange = () => { PLAN_UNIT = pu.value; route(); };
  $$("[data-pl]").forEach(inp => (inp.onchange = () => { const l = lineOf(inp.dataset.pl); l.plan[Number(inp.dataset.m)] = Math.round(Number(inp.value) * 1e6); save(); route(); }));
  const pa = $("#plan-auto"); if (pa) pa.onclick = () => {
    A.lines.filter(l => !PLAN_UNIT || l.unit === PLAN_UNIT).forEach(l => { l.plan = monthShape(l.type).map(f => Math.round(l.amount * f)); l.plan[11] += l.amount - sumv(l.plan); });
    audit(["กระจายแผนการใช้จ่ายอัตโนมัติ", "Spread the spending plan automatically"], PLAN_UNIT ? unitName(PLAN_UNIT) : L("ทุกหน่วยงาน", "All units")); re();
  };
  const tf = $("#tr-form");
  if (tf) tf.onsubmit = e => {
    e.preventDefault();
    const from = $("#tr-from").value, to = $("#tr-to").value, amount = Math.round(Number($("#tr-amt").value) * 1e6), why = $("#tr-why").value.trim();
    if (from === to) { toast(L("เลือกรายการต้นทางและปลายทางที่ต่างกัน", "Choose different source and destination lines")); return; }
    const avail = lineOf(from).amount - pendingOut(from);
    if (amount > avail) { toast(L(`โอนได้ไม่เกิน ${mb(avail)} ลบ. (หักรายการที่รอโอนแล้ว)`, `You can move at most ${mb(avail)} M (after pending transfers)`)); return; }
    const t = { id: `TR-${ALLOC_FY}-${String(A.transfers.length + 1).padStart(3, "0")}`, from, to, amount, why: [why, why], status: "pending", t: nowIso(), by: me().id };
    A.transfers.push(t);
    const lv = transferLevel(t);
    audit(["ขอโอนเปลี่ยนแปลงงบประมาณ", "Requested a budget transfer"], `${t.id} · ${mb(amount)}`);
    notify(lv[0] === "same" ? ["fin"] : ["exec"], [`มีคำขอโอนเปลี่ยนแปลง ${t.id} รออนุมัติ`, `Transfer ${t.id} is waiting for approval`], "allocation"); re();
    toast(L("ส่งคำขอโอนแล้ว · ", "Transfer requested · ") + lv[1]);
  };
  const decide = (id, ok) => {
    const t = A.transfers.find(x => x.id === id);
    t.status = ok ? "approved" : "rejected";
    if (ok) {
      const a = lineOf(t.from), b = lineOf(t.to);
      a.amount -= t.amount; b.amount += t.amount; scalePlan(a, a.amount); scalePlan(b, b.amount);
      if (a.type !== b.type) { A.byType[a.type] -= t.amount; A.byType[b.type] = (A.byType[b.type] || 0) + t.amount; }
    }
    const lv = transferLevel(t), by = lv[0] === "same" ? onBehalf("fin", "transfer") : onBehalf("exec", "transfer");
    audit([ok ? "อนุมัติการโอนเปลี่ยนแปลง" : "ไม่อนุมัติการโอนเปลี่ยนแปลง", ok ? "Approved a transfer" : "Rejected a transfer"], t.id + by);
    if (by) notify([lv[0] === "same" ? "fin" : "exec"], [`${userName(me().id)} ${ok ? "อนุมัติ" : "ไม่อนุมัติ"} ${t.id} แทนคุณตามการมอบอำนาจ`, `${userName(me().id)} ${ok ? "approved" : "rejected"} ${t.id} on your behalf`], "allocation");
    notify(["fin"], [`${t.id} ${ok ? "อนุมัติแล้ว" : "ไม่อนุมัติ"}`, `${t.id} was ${ok ? "approved" : "rejected"}`], "allocation"); re();
    toast(ok ? L("อนุมัติแล้ว · ปรับวงเงินและแผนการใช้จ่ายของทั้งสองรายการ", "Approved · both lines' amounts and plans updated") : L("ไม่อนุมัติแล้ว", "Rejected"));
  };
  $$("[data-tap]").forEach(b => (b.onclick = () => decide(b.dataset.tap, true)));
  $$("[data-trj]").forEach(b => (b.onclick = () => decide(b.dataset.trj, false)));
};

  };

  const t = () => S.tpl.find(x => x.id === TPL_OPEN) || S.tpl[0];
  $("#tpl-sel").onchange = e => { TPL_OPEN = e.target.value; route(); };
  const prev = () => { const v = TPL_SAMPLE(); $("#tpl-prev").innerHTML = `<b>${fillTpl($("#tpl-subj").value, v)}</b><p>${fillTpl($("#tpl-body").value, v).replace(/\n/g, "<br>")}</p>`; };
  $("#tpl-subj").oninput = prev; $("#tpl-body").oninput = prev;
  $("#tpl-save").onclick = () => {
    const x = t(), i = LANG === "en" ? 1 : 0;
    x.subj[i] = $("#tpl-subj").value; x.body[i] = $("#tpl-body").value;
    $$("[data-tch]").forEach(c => (x.ch[c.dataset.tch] = c.checked));
    audit(["แก้ไขแม่แบบการแจ้งเตือน", "Changed a notification template"], `${x.id} ${tx(x.ev)}`); commit(); toast(L("บันทึกแม่แบบแล้ว", "Template saved"));
  };
  $$("[data-wsla]").forEach(inp => (inp.onchange = () => { const w = S.workflow.find(x => x.id === inp.dataset.wsla), old = w.sla; w.sla = Number(inp.value); audit(["แก้ไข SLA ขั้นตอน", "Changed a step SLA"], `${tx(w.name)}: ${old} → ${w.sla}`); commit(); route(); }));
  $$("[data-esc]").forEach(inp => (inp.onchange = () => {
    const [id, k] = inp.dataset.esc.split("|"); S.escal[id] = S.escal[id] || { remind: 1, to: "exec", after: 1 };
    S.escal[id][k] = k === "to" ? inp.value : Number(inp.value);
    audit(["แก้ไขกติกาการยกระดับ", "Changed an escalation rule"], `${id} ${k}: ${inp.value}`); commit(); route();
  }));
  $("#sla-run").onclick = () => {
    let soon = 0, over = 0;
    slaItems().forEach(x => {
      const e = S.escal[x.w.id] || { remind: 1, to: "exec", after: 1 };
      if (x.left < 0 && -x.left >= e.after) { over++; notify([e.to, x.w.role], [`เกินกำหนด ${-x.left} วัน: ${x.w.name[0]} คำขอ ${x.r.id}`, `${-x.left} days overdue: ${x.w.name[1]} for ${x.r.id}`], `req:${x.r.id}`); }
      else if (x.left >= 0 && x.left <= e.remind) { soon++; notify([x.w.role], [`เหลือ ${x.left} วัน: ${x.w.name[0]} คำขอ ${x.r.id}`, `${x.left} days left: ${x.w.name[1]} for ${x.r.id}`], `req:${x.r.id}`); }
    });
    audit(["สั่งตรวจ SLA และส่งแจ้งเตือน", "Ran the SLA check"], `${soon} / ${over}`); commit(); renderShell(); route();
    toast(`${L("ส่งเตือนใกล้ครบกำหนด", "Due-soon reminders")} ${soon} · ${L("ยกระดับเกินกำหนด", "overdue escalations")} ${over}`);
  };
};

function runSearch(q) {
  const p = $("#spanel"), inp = $("#gsearch");
  q = q.trim().toLowerCase();
  if (!q) { p.hidden = true; inp.setAttribute("aria-expanded", "false"); return; }
  const words = q.split(/\s+/);
  const hits = searchItems().filter(i => words.every(w => i.hay.includes(w)));
  const by = {}; hits.forEach(h => (by[h.type] = by[h.type] || []).push(h));
  S_HITS = []; let html = "";
  Object.keys(STYPE).forEach(t => { if (!by[t]) return;
    html += `<div class="sgroup">${tx(STYPE[t])} <span class="sub">${by[t].length}</span></div>`;
    by[t].slice(0, 6).forEach(h => { html += `<div class="sitem" role="option" id="sh-${S_HITS.length}" data-si="${S_HITS.length}"><b>${esc(h.label)}</b><small>${esc(h.sub)}</small></div>`; S_HITS.push(h); });
  });
  p.innerHTML = html || `<div class="sitem" style="cursor:default"><small>${L("ไม่พบผลลัพธ์ที่ตรงกับ", "Nothing matches")} “${esc(q)}”</small></div>`;
  p.hidden = false; inp.setAttribute("aria-expanded", "true");
  S_SEL = 0; markSel();
  $$("#spanel [data-si]").forEach(el => (el.onmousedown = e => { e.preventDefault(); pick(Number(el.dataset.si)); }));
}
function markSel() { $$("#spanel .sitem").forEach(el => el.classList.toggle("on", Number(el.dataset.si) === S_SEL)); const el = $("#sh-" + S_SEL); if (el) { el.scrollIntoView({ block: "nearest" }); $("#gsearch").setAttribute("aria-activedescendant", el.id); } }
function pick(i) { const h = S_HITS[i]; if (!h) return; $("#gsearch").value = ""; $("#spanel").hidden = true; $("#gsearch").blur(); h.run(); }
function bindSearch() {
  const inp = $("#gsearch");
  inp.oninput = () => runSearch(inp.value);
  inp.onfocus = () => { if (inp.value) runSearch(inp.value); };
  inp.onblur = () => setTimeout(() => ($("#spanel").hidden = true), 120);
  inp.onkeydown = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); S_SEL = Math.min(S_HITS.length - 1, S_SEL + 1); markSel(); }
    if (e.key === "ArrowUp") { e.preventDefault(); S_SEL = Math.max(0, S_SEL - 1); markSel(); }
    if (e.key === "Enter") { e.preventDefault(); pick(S_SEL); }
    if (e.key === "Escape") { inp.value = ""; $("#spanel").hidden = true; inp.blur(); }
  };
  document.addEventListener("keydown", e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { if ($("#signin").hidden) { e.preventDefault(); inp.focus(); } }
  });
}
