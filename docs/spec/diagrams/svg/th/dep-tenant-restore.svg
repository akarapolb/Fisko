<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:512px;height:965px;background:#FFFFFF;" width="512.5px" height="965.625px" viewBox="0 0 512 965" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>การกู้คืนรายหน่วยงาน</title><desc>ผู้ปฏิบัติการขออนุมัติพร้อมเหตุผล กู้สำเนาคลัสเตอร์ลงสภาพแวดล้อมแยก ส่งออกแถวของผู้เช่า ตรวจลูกโซ่ Audit แล้วนำเข้าเซลล์จริงในโหมดบำรุงรักษาของผู้เช่านั้น ผู้เช่าอื่นไม่ได้รับผลกระทบ</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="253.832" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="46.418" y="85.938" width="414.827" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="62.043" y="123.482" fill="#000" font-size="20.313" textLength="383.577" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">หน่วยงานขอ ผู้ปฏิบัติการบันทึกเหตุผลและรับอนุมัติ</text><rect x="133.242" y="175.455" width="241.179" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="148.867" y="212.999" fill="#000" font-size="20.313" textLength="209.929" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">ตั้งผู้เช่าเป็นโหมดบำรุงรักษา</text><rect x="25" y="264.972" width="457.664" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="302.516" fill="#000" font-size="20.313" textLength="426.414" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">กู้สำเนาคลัสเตอร์ ณ เวลาที่ต้องการในสภาพแวดล้อมแยก</text><rect x="32.92" y="354.489" width="441.824" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="48.545" y="392.033" fill="#000" 