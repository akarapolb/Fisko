<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1710px;height:318px;background:#FFFFFF;" width="1710.938px" height="318.75px" viewBox="0 0 1710 318" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Audit log แบบลูกโซ่แฮชและการลบข้อมูลส่วนบุคคล</title><desc>รายการ Audit แต่ละรายการเก็บแฮชของรายการก่อนหน้าและอ้างอิงบุคคลแบบแฝงนาม จุดตรวจเก็บแยกที่อื่น รายละเอียดบุคคลอยู่ในตารางแยกภายใต้กุญแจรายบุคคล การทำลายกุญแจทำให้อ่านรายละเอียดไม่ได้โดยลูกโซ่ยังตรวจสอบได้</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--entity e1--><g class="entity" data-qualified-name="e1" id="ent0001" data-source-line="10"><rect x="1382.813" y="207.813" width="303.416" height="85.284" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1487.344" y="245.357" fill="#111827" font-size="20.313" textLength="94.352" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">รายการ n-1</text><text x="1398.438" y="272.374" fill="#111827" font-size="20.313" textLength="272.166" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">subject_ref, การกระทำ, เวลา, แฮช</text></g><!--entity e2--><g class="entity" data-qualified-name="e2" id="ent0002" data-source-line="11"><rect x="871.875" y="190.625" width="303.416" height="85.284" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="985.943" y="228.169" fill="#111827" font-size="20.313" textLength="75.279" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">รายการ n</text><text x="887.5" y="255.186" fill="#111827" font-size="20.313" textLength="272.166" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">subject_ref, การกระทำ, เวลา, แฮช</text></g><!--entity e3--><g class="entity" data-q