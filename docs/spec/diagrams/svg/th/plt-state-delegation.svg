<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1892px;height:464px;background:#FFFFFF;" width="1892.188px" height="464.063px" viewBox="0 0 1892 464" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>สถานะของการมอบอำนาจ</title><desc>การมอบอำนาจคำนวณสถานะจากวันที่และการยกเลิก รอเริ่มเมื่อยังไม่ถึงวันเริ่ม มีผลเมื่ออยู่ในช่วงวันที่ หมดอายุเมื่อพ้นวันสิ้นสุด และยกเลิกแล้วเมื่อผู้มอบหรือผู้ดูแลระบบยกเลิก ระบบจริงเพิ่มสถานะพักไว้เมื่อผู้มอบหรือผู้รับมอบถูกระงับหรือเปลี่ยนบทบาท</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="380.469" y="377.611" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="392.574" y="417.272" fill="#000" font-size="20.313" textLength="53.915" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">future</text><rect x="707.813" y="158.861" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="720.939" y="198.522" fill="#000" font-size="20.313" textLength="51.872" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">active</text><rect x="1225" y="154.173" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1244.563" y="193.834" fill="#000" font-size="20.313" textLength="38.998" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">held</text><rect x="1574.219" y="27.611" width="82.077" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1582.031" y="67.272" fill="#000" font-size="20.313" textLength="66.452" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">expired</text><rect x="1571.875" y="286.986" width