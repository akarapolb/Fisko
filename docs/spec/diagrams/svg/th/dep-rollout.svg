<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:435px;height:1142px;background:#FFFFFF;" width="435.938px" height="1142.188px" viewBox="0 0 435 1142" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>การอัปเกรดทีละเซลล์</title><desc>รุ่นใหม่เริ่มจากเซลล์ canary ด้วยขั้น expand ของ schema แล้วทยอยเปลี่ยนอินสแตนซ์ เฝ้าดูตัวชี้วัด หากผ่านจึงไปเซลล์ถัดไป หากไม่ผ่านจะหยุดและถอยแอปกลับ ขั้น contract ทำหลังทุกเซลล์ใช้รุ่นใหม่แล้ว</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="191.863" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="67.966" y="85.938" width="247.794" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="83.591" y="123.482" fill="#000" font-size="20.313" textLength="216.544" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Argo CD รับรุ่นที่ลงนามแล้ว</text><rect x="105.045" y="175.455" width="173.636" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="120.67" y="212.999" fill="#000" font-size="20.313" textLength="142.386" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">เลือกเซลล์ canary</text><rect x="73.49" y="333.722" width="236.745" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="89.115" y="371.266" fill="#000" font-size="20.313" textLength="205.495" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">ขั้น expand ของ schema</text><rect x="73.069" y="423.239" width="237.589" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="88.694" y="460.783" fill="#000" font-size="20.313" textLength="206.339" font