<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:709px;height:729px;background:#FFFFFF;" width="709.375px" height="729.688px" viewBox="0 0 709 729" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>ชั้นการบังคับแยกผู้เช่า</title><desc>tenant มาจากโทเค็นที่ตรวจแล้ว และถูกบังคับซ้ำในทุกชั้น ได้แก่ router แอปพลิเคชัน Row-Level Security กุญแจรายผู้เช่า ตัวกรองการค้นหา ที่เก็บไฟล์ เหตุการณ์ และ telemetry ความผิดพลาดในชั้นหนึ่งไม่เปิดข้อมูลของผู้เช่าอื่น</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--entity l1--><g class="entity" data-qualified-name="l1" id="ent0001" data-source-line="8"><rect x="9.375" y="18.75" width="674.763" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="25" y="56.294" fill="#111827" font-size="20.313" textLength="643.513" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">1. โทเค็นที่ตรวจแล้ว: claim ของ organization ไม่รับ tenant จาก path หรือ body</text></g><!--entity l2--><g class="entity" data-qualified-name="l2" id="ent0002" data-source-line="9"><rect x="169.531" y="123.438" width="355.109" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="185.156" y="160.982" fill="#111827" font-size="20.313" textLength="323.859" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">2. Router: ส่งไปเซลล์ของหน่วยงานเท่านั้น</text></g><!--entity l3--><g class="entity" data-qualified-name="l3" id="ent0003" data-source-line="10"><rect x="129.688" y="228.125" width="434.951" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="145.313" y="265.669" fill="#111827" font-size="20.313" textLength="403.701" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">3. TenantContext: ผูกกับคำขอหรืองานหนึ่งรายการ</text></g><!--entity l4--><g class="entity" data-qualified-name="l4" id="ent0004" data-source-line="11"><rect x="35.156" y="332.813" width="624.091" height="58.267" fill="#ECF0FA" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="50.781" y="370.357" fill="#111827" font-size="20.313" textLength="592.841" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">4. PostgreSQL RLS: SET LOCAL app.tenant_id ไม่ตั้งค่าแล้วคำสั่งล้มเหลว</text></g><!--entity l5--><g class="entity" data-qualified-name="l5" id="ent0005" data-source-line="12"><rect x="79.688" y="437.5" width="534.093" height="58.267" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="95.313" y="475.044" fill="#111827" font-size="20.313" textLength="502.843" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">5. กุญแจรายผู้เช่า: กุญแจของผู้เช่าหนึ่งเปิดข้อมูลของอีกผู้เช่าไม่ได้</text></g><!--entity l6--><g class="entity" data-qualified-name="l6" id="ent0006" data-source-line="13"><rect x="23.438" y="542.188" width="647.012" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="39.063" y="579.732" fill="#111827" font-size="20.313" textLength="615.762" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">6. OpenSearch และ S3: ตัวกรอง tenant บนเซิร์ฟเวอร์ และ prefix ของ tenant</text></g><!--entity l7--><g class="entity" data-qualified-name="l7" id="ent0007" data-source-line="14"><rect x="92.188" y="646.875" width="509.04" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="107.813" y="684.419" fill="#111827" font-size="20.313" textLength="477.79" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">7. เหตุการณ์และ telemetry: มี tenantId ไม่มีข้อมูลส่วนบุคคล</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="346.875,123.062,353.125,109,346.875,115.25,340.625,109,346.875,123.062" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M346.875,76.971 C346.875,91.302 346.875,100.924 346.875,115.25" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="346.875,227.75,353.125,213.687,346.875,219.937,340.625,213.687,346.875,227.75" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M346.875,181.659 C346.875,195.989 346.875,205.612 346.875,219.937" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="346.875,332.437,353.125,318.375,346.875,324.625,340.625,318.375,346.875,332.437" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M346.875,286.346 C346.875,300.677 346.875,310.299 346.875,324.625" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="346.875,437.125,353.125,423.062,346.875,429.312,340.625,423.062,346.875,437.125" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M346.875,391.034 C346.875,405.364 346.875,414.987 346.875,429.312" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="346.875,541.812,353.125,527.75,346.875,534,340.625,527.75,346.875,541.812" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M346.875,495.721 C346.875,510.052 346.875,519.674 346.875,534" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="346.875,646.5,353.125,632.437,346.875,638.687,340.625,632.437,346.875,646.5" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M346.875,600.409 C346.875,614.739 346.875,624.362 346.875,638.687" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><?plantuml-src dLPjIsD75FwUNt5g2zj2Sgl6bvA5WeX28R3RZVHh6U-TwAqtC-dCP3NxgR62xjf-QhSIbIvMbe0YT6stdVoR-rDwvjmxkKcqoxOWIMRcp3dFSrwUyODOX4aduf1_VnhALakAeDrf9QK7O6AJyC1iro2rBrBx9Xq-Jsq_jRtKtgRsChMdRjCUflQ0VfocGppwZGpEKpjqziFltDtX4LuPUUIY1dNMvKg3R8BXWWa3N3Ib2dcB2uE64TSXHSvFKtj1GO_eivSEzrDxGiuFqk4XeJf9xLiAz9Am3Ponm_EQO0yWNzZVK_kB0-TGtY5WZydwZtJulNTgoRBWZuxG-cSYroCiHw1ant2LXRX9xLbgVwLOV-OGi-juzudShTJvKvv0WuST5Pika7iCyYFTFYBmjvJ6Ut88HEyDqUkHwGtX7vNam1VfEhFsMN4-UfIgKyB_YXBp0z31DNcrOsv-oixoZ64L4goCKGxj0GM_fOgSEugOYvpkBUKboznumrpJvrz4uP32NtXCPzx3FXdVaDiXUTltvEx90ntzJR_xlbrSMsriSzyosCjSGrF95Z1uobNSZ7a4Hkvm0Kn446lVSn6mBHRZBdOX2xSXSRrPoujQ1jPk9t78J2n56JTtAmaLKES5B4ERgqeUT8TtTHcFc48_pJWX1_ZDGHkfs1Ol0ruMHXE4KLe3M85Mh0tRSRC8Kl0C14GIEGY9mFRQKdEy9SqsxcVX7cY8c651IU_4eiqKQw4jveAtONvsR5CniUCsgxCbnKF3n1O2cld8V3mp5y3_cAKQX0cBMp2g4KYrnKJyZ984HONTPJTNnHZd0mnjPhQ1EkFI5TBUmAQCkZDbS92-cgXMRT8xXNu80lEeiBAvPwepfYPpB5NcxfCPO1gIkMdQym5EegkkaxQhiRuyepmSK_-v-HZhGcfYPpcWuJma8dsoF_5DsHyrlMCo5aLp4Q7QYQIBd0Wdze88krZ1a2U91pe_3RGQm0OHN9N2y3tZy9vxzUfvqJfmYfKZBJ9QO9mQm49XydbtOEz6sfGTrwEIsb7nRpjS6vVPR-IcnrkTnhiGm6EfpPRYZI_hyAJUg45ZRGFgZrPNwcwGWgnSNyVHU9Uyz6aZ9SvoETPkdk0LcMKKigCBBrzOhe5ZyVxn7q97Q6wWnPdGL14SFqFl3pHPd6ZFSG4-N5jTdrrVcUQw6FmtxQxTDN-tn4t9vdkgvOsRtNzvWiUqDt_3NDAGoED92QjHpKSYWriGCk5qIBP9Fac5SldnYLh4H7sslhYsEfsefG0UuRL6feh5gzAerkv_pmgvEFKZTapCBsaaNz7EW6ml9n-gjkBDU6zCc39FZkKa2YU_Bhxc2dMaekDez71aifqBDEraNZtFfMb-oy6xdj5xNj5Qzl_Cszp_