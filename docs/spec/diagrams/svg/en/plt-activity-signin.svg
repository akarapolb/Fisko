<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:618px;height:1876px;background:#FFFFFF;" width="618.75px" height="1876.563px" viewBox="0 0 618 1876" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Sign-in and idle timeout</title><desc>The user goes to the identity provider through Keycloak. The system stops a suspended account, requires MFA setup, checks the code, then starts a session and logs it. When idle time nears the limit it warns, and it ends the session at the limit.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="306.408" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="73.391" y="85.938" width="466.035" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="89.016" y="123.482" fill="#000" font-size="20.313" textLength="434.785" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The user opens Fisko and sees the privacy notice</text><rect x="25" y="175.455" width="562.817" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="212.999" fill="#000" font-size="20.313" textLength="531.567" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Go to the organisation's identity provider through Keycloak</text><rect x="95.91" y="343.066" width="420.996" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="111.535" y="380.611" fill="#000" font-size="20.313" textLength="389.746" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Refuse and say to contact the administrator</text><ellipse cx="306.408" cy="460.481" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="306.408" cy="460.481" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="213.584,264.972,399.233,264.972,417.983,283.722,399.233,302.472,213.584,302.472,194.834,283.722,213.584,264.972" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="312.658" y="322.705" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><text x="213.584" y="292.133" fill="#000" font-size="20.313" textLength="185.649" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Account suspended?</text><text x="417.983" y="279.016" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><rect x="183.27" y="621.388" width="246.277" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="198.895" y="658.932" fill="#000" font-size="20.313" textLength="215.027" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Require setup and log it</text><polygon points="250.881,543.294,361.935,543.294,380.685,562.044,361.935,580.794,250.881,580.794,232.131,562.044,250.881,543.294" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="312.658" y="601.027" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="250.881" y="570.454" fill="#000" font-size="20.313" textLength="111.054" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">MFA set up?</text><text x="380.685" y="557.338" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><polygon points="306.408,710.905,325.158,729.6