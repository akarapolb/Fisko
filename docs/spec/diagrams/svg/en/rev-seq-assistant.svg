<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1203px;height:1084px;background:#FFFFFF;" width="1203.125px" height="1084.375px" viewBox="0 0 1203 1084" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>The assistant answers from tools through the gateway</title><desc>The user asks. AssistantRouter refuses what AI may not do. Review tools read from modules with the rights of the asker. With AI off, the system shows the tool results as a table with sources. With AI on, the gateway applies policy, removes personal data and logs the call, and the figures in the reply are checked against the tool results before showing.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="20.313" y="409.525" width="1142.426" height="500.876" fill="#F7F8FA" style="stroke:#F7F8FA;stroke-width:1.563;" rx="7.813" ry="7.813"/><rect x="20.313" y="409.525" width="1142.426" height="500.876" fill="none" style="stroke:#D7DAE0;stroke-width:2.344;" rx="7.813" ry="7.813"/><g class="participant-lifeline" data-qualified-name="u" data-entity-uid="part1" id="part1-lifeline" data-source-line="7"><g><title>User</title><rect x="39.844" y="136.392" width="12.5" height="811.508" fill="#000" fill-opacity="0"/><line x1="45.313" y1="136.392" x2="45.313" y2="947.9" style="stroke:#D7DAE0;stroke-width:0.781;stroke-dasharray:7.813,7.813;"/></g></g><g class="participant-lifeline" data-qualified-name="a" data-entity-uid="part2" id="part2-lifeline" data-source-line="8"><g><title>AssistantRouter</title><rect x="161.017" y="136.392" width="12.5" height="811.508" fill="#000" fill-opacity="0"/><line x1="166.486" y1="136.392" x2="166.486" y2="947.9" style="stroke:#D7DAE0;stroke-width:0.781;stroke-dasharray:7.813,7.813;"/></g></g><g class="participant-lifeline" data-qualified-name="t" data-entity-uid="part3" id