<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:550px;height:1142px;background:#FFFFFF;" width="550px" height="1142.188px" viewBox="0 0 550 1142" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Rolling upgrade across cells</title><desc>A release starts on a canary cell with the schema expand step, replaces instances gradually and watches the indicators. If it passes, it goes to the next cell. If not, the rollout stops and the application is rolled back. The contract step runs once every cell is on the new release.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="249.309" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="72.87" y="85.938" width="352.878" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="88.495" y="123.482" fill="#000" font-size="20.313" textLength="321.628" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Argo CD receives the signed release</text><rect x="148.809" y="175.455" width="201" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="164.434" y="212.999" fill="#000" font-size="20.313" textLength="169.75" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Pick the canary cell</text><rect x="104.638" y="333.722" width="289.342" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="120.263" y="371.266" fill="#000" font-size="20.313" textLength="258.092" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Run the schema expand step</text><rect x="58.271" y="423.239" width="382.077" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="73.896" y="460.783" fill="#000" font-size="20.313" textLength="350.827" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Replace application instances gradually</text><rect x="116.996" y="512.756" width="264.626" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="132.621" y="550.301" fill="#000" font-size="20.313" textLength="233.376" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Watch the cell's indicators</text><rect x="50.723" y="696.478" width="397.173" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="66.348" y="734.023" fill="#000" font-size="20.313" textLength="365.923" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Stop the rollout, roll the application back</text><ellipse cx="249.309" cy="813.893" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="249.309" cy="813.893" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="178.235,618.384,320.383,618.384,339.133,637.134,320.383,655.884,178.235,655.884,159.485,637.134,178.235,618.384" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="255.559" y="676.117" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="178.235" y="645.544" fill="#000" font-size="20.313" textLength="142.148" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Indicators pass?</text><polygon points="249.309,264.972,268.059,283.722,249.309,302.472,230.559,283.722,249.309,264.972" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="206.755,896.706,291.863,896.706,310.613,915.456,291.863,934.206,206.755,93