.789" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="855.469" y="531.848" fill="#000" font-size="20.313" textLength="77.164" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Rejected</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="15"><ellipse cx="25" cy="151.563" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="21"><ellipse cx="1120.313" cy="209.375" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="1120.313" cy="209.375" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-link-type="dependency"><polygon points="594.883,57.303,579.967,53.517,587.183,58.622,582.078,65.838,594.883,57.303" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M41.062,152.203 C117.135,139.167 463.668,79.787 587.183,58.622" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="121.875" y="107.733" fill="#000" font-size="18.75" textLength="148.865" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">condition not met</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="351.208,261.175,337.264,254.664,343.397,261.029,337.032,267.162,351.208,261.175" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M40.826,168.608 C57.856,184.331 87.925,209.353 118.75,221.875 C196.721,253.548 288.484,260.007 343.397,261.029" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="138.281" y="215.546" fill="#000" font-size="18.75" textLength="115.778" font-family="'Leelawadee UI', Tahoma, 'Noto 