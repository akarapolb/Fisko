<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:865px;height:923px;background:#FFFFFF;" width="865.625px" height="923.438px" viewBox="0 0 865 923" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of one outbound delivery</title><desc>A delivery goes from pending to sending. Success makes it delivered, a temporary failure makes it retrying, and a rejection or used-up attempts make it failed. An officer can resend or cancel. Users can see every state.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="7"><ellipse cx="389.844" cy="34.375" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><rect x="344.531" y="114.063" width="90.022" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="352.344" y="153.723" fill="#000" font-size="20.313" textLength="74.397" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">pending</text><rect x="346.875" y="262.5" width="86.699" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="354.688" y="302.161" fill="#000" font-size="20.313" textLength="71.074" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">sending</text><rect x="9.375" y="501.563" width="98.045" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="17.188" y="541.223" fill="#000" font-size="20.313" textLength="82.42" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">delivered</text><rect x="346.875" y="410.938" width="85.459" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="354.688" y="450.598" fill="#000" font-size="20.313" textLength="69.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">retrying</text><rect x="422.656" y="592.188" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="437.161" y="631.848" fill="#000" font-size="20.313" textLength="49.115" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">failed</text><rect x="260.156" y="740.625" width="99.265" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="267.969" y="780.286" fill="#000" font-size="20.313" textLength="83.64" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">cancelled</text><g class="end_entity" data-qualified-name=".end." id="ent0017" data-source-line="16"><ellipse cx="230.469" cy="878.125" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="230.469" cy="878.125" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-link-type="dependency"><polygon points="389.844,113.724,396.094,99.662,389.844,105.912,383.594,99.662,389.844,113.724" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M389.844,56.35 C389.844,71.913 389.844,87.318 389.844,105.912" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-link-type="dependency"><polygon points="389.844,262.117,396.094,248.055,389.844,254.305,383.594,248.055,389.844,262.117" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M389.844,176.984 C389.844,201.923 389.844,229.376 389.844,254.305" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="392.969" y="228.046" fill="#000" font-si