<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1037px;height:804px;background:#FFFFFF;" width="1037.5px" height="804.688px" viewBox="0 0 1037 804" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of an agent run</title><desc>A run starts as running, waits for a person at a step that writes or notifies, and goes on when a person decides that one step. It ends when no step is left, and can be stopped with a reason. Approved steps stay in effect.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="476.402" y="179.688" width="85.548" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="484.214" y="219.348" fill="#000" font-size="20.313" textLength="69.923" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">running</text><rect x="299.058" y="365.625" width="80.817" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="306.871" y="405.286" fill="#000" font-size="20.313" textLength="65.192" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">waiting</text><rect x="952.183" y="475" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="968.255" y="514.661" fill="#000" font-size="20.313" textLength="45.981" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">done</text><rect x="613.902" y="584.375" width="89.496" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="621.714" y="624.036" fill="#000" font-size="20.313" textLength="73.871" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">stopped</text><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="13"><ellipse cx="519.371" cy="34.375" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="19"><ellipse cx="808.433" cy="759.375" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="808.433" cy="759.375" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-link-type="dependency"><polygon points="519.371,179.657,525.621,165.595,519.371,171.845,513.121,165.595,519.371,179.657" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M519.371,56.647 C519.371,85.714 519.371,136.281 519.371,171.845" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="522.496" y="126.483" fill="#000" font-size="18.75" textLength="132.632" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">agent and AI on</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="298.774,393.573,285.098,386.517,290.975,393.119,284.372,398.996,298.774,393.573" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M475.869,213.033 C372.815,215.311 118.519,227.215 66.246,289.063 C0,367.44 199.646,387.807 290.975,393.119" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="69.371" y="312.421" fill="#000" font-size="18.75" textLength="192.114" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">a step writes or notifies</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk8" data-link-type="dependency"><polygon points="476.148,222.905,460.874,221.023,468.674,225.181,464.516,232.981,476.148,222.905" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;s