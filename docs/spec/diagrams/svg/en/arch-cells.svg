<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:857px;height:984px;background:#FFFFFF;" width="857.813px" height="984.375px" viewBox="0 0 857 984" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Cells and the global services</title><desc>A global router sends each agency to its cell. Small agencies share cells, and a large agency has its own. The control plane rolls out one cell at a time and can move an agency between cells.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--cluster c1--><g class="cluster" data-qualified-name="c1" id="ent0002" data-source-line="10"><path d="M29.688,209.375 L270.143,209.375 A11.719,11.719 0 0 1 277.956,217.188 L288.893,245.767 L284.375,245.767 A7.813,7.813 0 0 1 292.188,253.58 L292.188,564.063 A7.813,7.813 0 0 1 284.375,571.875 L29.688,571.875 A7.813,7.813 0 0 1 21.875,564.063 L21.875,217.188 A7.813,7.813 0 0 1 29.688,209.375" style="stroke:#D7DAE0;stroke-width:2.344;" fill="#F7F8FA"/><line x1="21.875" y1="245.767" x2="288.893" y2="245.767" style="stroke:#D7DAE0;stroke-width:2.344;"/><text x="28.125" y="234.419" fill="#5B6270" font-size="20.313" textLength="246.706" font-weight="700" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Shared cell 1, release N+1</text></g><!--cluster c2--><g class="cluster" data-qualified-name="c2" id="ent0005" data-source-line="14"><path d="M325,209.375 L539.41,209.375 A11.719,11.719 0 0 1 547.223,217.188 L558.16,245.767 L554.688,245.767 A7.813,7.813 0 0 1 562.5,253.58 L562.5,564.063 A7.813,7.813 0 0 1 554.688,571.875 L325,571.875 A7.813,7.813 0 0 1 317.188,564.063 L317.188,217.188 A7.813,7.813 0 0 1 325,209.375" style="stroke:#D7DAE0;stroke-width:2.344;" fill="#F7F8FA"/><line x1="317.188" y1="245.767" x2="558.16" y2="245.767" style="stroke:#D7DAE0;stroke-widt