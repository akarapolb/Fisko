<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1814px;height:318px;background:#FFFFFF;" width="1814.063px" height="318.75px" viewBox="0 0 1814 318" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Hash-chained audit log and erasure</title><desc>Each audit entry holds the hash of the previous entry and a pseudonymous subject reference. Checkpoints are stored elsewhere. Personal details sit in a separate table under a per-subject key. Destroying the key makes the details unreadable and the chain still verifies.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--entity e1--><g class="entity" data-qualified-name="e1" id="ent0001" data-source-line="10"><rect x="1495.313" y="207.813" width="294.271" height="85.284" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1601.61" y="245.357" fill="#111827" font-size="20.313" textLength="81.676" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Entry n-1</text><text x="1510.938" y="272.374" fill="#111827" font-size="20.313" textLength="263.021" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">subject_ref, action, time, hash</text></g><!--entity e2--><g class="entity" data-qualified-name="e2" id="ent0002" data-source-line="11"><rect x="968.75" y="190.625" width="294.271" height="85.284" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1084.584" y="228.169" fill="#111827" font-size="20.313" textLength="62.604" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Entry n</text><text x="984.375" y="255.186" fill="#111827" font-size="20.313" textLength="263.021" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">subject_ref, action, time, hash</text></g><!--entity e3--><g class="entity" data-qualified-name="e3" id="ent0003" data-source-line="12"><rect x="445.313" y="190.625" width="294.271" height="85.284" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="548.724" y="228.169" fill="#111827" font-size="20.313" textLength="87.449" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Entry n+1</text><text x="460.938" y="255.186" fill="#111827" font-size="20.313" textLength="263.021" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">subject_ref, action, time, hash</text></g><!--entity cp--><g class="entity" data-qualified-name="cp" id="ent0004" data-source-line="13"><rect x="9.375" y="190.625" width="281.427" height="85.284" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="99.431" y="228.169" fill="#111827" font-size="20.313" textLength="101.315" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Checkpoint</text><text x="25" y="255.186" fill="#111827" font-size="20.313" textLength="250.177" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">stored outside the database</text></g><!--entity sub--><g class="entity" data-qualified-name="sub" id="ent0005" data-source-line="14"><path d="M1550,52.344 C1550,36.719 1642.437,36.719 1642.437,36.719 C1642.437,36.719 1734.873,36.719 1734.873,52.344 L1734.873,120.441 C1734.873,136.066 1642.437,136.066 1642.437,136.066 C1642.437,136.066 1550,136.066 1550,120.441 L1550,52.344" style="stroke:#4A5FA3;stroke-width:0.781;" fill="#ECF0FA"/><path d="M1550,52.344 C1550,67.969 1642.437,67.969 1642.437,67.969 C1642.437,67.969 1734.873,67.969 1734.873,52.344" style="stroke:#4A5FA3;stroke-width:0.781;" fill="none"/><text x="1584.286" y="96.138" fill="#000" font-size="20.313" textLength="116.301" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Subject table</text><text x="1565.625" y="123.155" fill="#000" font-size="20.313" textLength="153.623" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">encrypted details</text></g><!--entity key--><g class="entity" data-qualified-name="key" id="ent0006" data-source-line="15"><rect x="1012.5" y="18.75" width="206.552" height="100.909" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="1187.802" y="26.563" width="23.438" height="15.625" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="1184.677" y="29.688" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="1184.677" y="35.938" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><text x="1039.384" y="71.919" fill="#111827" font-size="20.313" textLength="137.159" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Per-subject key</text><text x="1035.938" y="98.936" fill="#111827" font-size="20.313" textLength="144.052" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">destroy to erase</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk7" data-link-type="dependency"><polygon points="1495.231,257.149,1481.024,251.235,1487.421,257.334,1481.321,263.731,1495.231,257.149" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1262.861,251.394 C1281.127,253.076 1299.574,254.508 1317.188,255.469 C1375.365,258.641 1431.7,258.657 1487.421,257.334" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="1321.875" y="249.139" fill="#000" font-size="18.75" textLength="114.276" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">previous hash</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="968.47,233.594,954.407,227.344,960.657,233.594,954.407,239.844,968.4