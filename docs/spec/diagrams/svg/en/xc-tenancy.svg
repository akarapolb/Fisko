<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:757px;height:729px;background:#FFFFFF;" width="757.813px" height="729.688px" viewBox="0 0 757 729" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Layers of tenant enforcement</title><desc>The tenant comes from a verified token and is enforced again at each layer: router, application, row-level security, per-tenant keys, search filter, file storage, events and telemetry. A mistake in one layer does not expose another tenant&#x27;s data.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--entity l1--><g class="entity" data-qualified-name="l1" id="ent0001" data-source-line="8"><rect x="22.656" y="18.75" width="696.355" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="38.281" y="56.294" fill="#111827" font-size="20.313" textLength="665.105" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">1. Verified token: organization claim; never a tenant from the path or body</text></g><!--entity l2--><g class="entity" data-qualified-name="l2" id="ent0002" data-source-line="9"><rect x="174.219" y="123.438" width="394.078" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="189.844" y="160.982" fill="#111827" font-size="20.313" textLength="362.828" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">2. Router: sends only to the agency's cell</text></g><!--entity l3--><g class="entity" data-qualified-name="l3" id="ent0003" data-source-line="10"><rect x="146.875" y="228.125" width="447.706" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="162.5" y="265.669" fill="#111827" font-size="20.313" textLength="416.456" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">3. TenantContext: bound to one request or job</text></g><!--entity l4--><g class="entity" data-qualified-name="l4" id="ent0004" data-source-line="11"><rect x="9.375" y="332.813" width="722.787" height="58.267" fill="#ECF0FA" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="25" y="370.357" fill="#111827" font-size="20.313" textLength="691.537" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">4. PostgreSQL RLS: SET LOCAL app.tenant_id; unset means the statement fails</text></g><!--entity l5--><g class="entity" data-qualified-name="l5" id="ent0005" data-source-line="12"><rect x="71.094" y="437.5" width="600.774" height="58.267" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="86.719" y="475.044" fill="#111827" font-size="20.313" textLength="569.524" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">5. Per-tenant keys: one tenant's key cannot open another's data</text></g><!--entity l6--><g class="entity" data-qualified-name="l6" id="ent0006" data-source-line="13"><rect x="69.531" y="542.188" width="603.848" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="85.156" y="579.732" fill="#111827" font-size="20.313" textLength="572.598" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">6. OpenSearch and S3: server-side tenant filter and tenant prefix</text></g><!--entity l7--><g class="entity" data-qualified-name="l7" id="ent0007" data-source-line="14"><rect x="103.906" y="646.875" width="534.837" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="119.531" y="684.419" fill="#111827" font-size="20.313" textLength="503.587" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">7. Events and telemetry: carry tenantId, no personal data</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="371.094,123.062,377.344,109,371.094,115.25,364.844,109,371.094,123.062" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M371.094,76.971 C371.094,91.302 371.094,100.924 371.094,115.25" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="371.094,227.75,377.344,213.687,371.094,219.937,364.844,213.687,371.094,227.75" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M371.094,181.659 C371.094,195.989 371.094,205.612 371.094,219.937" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="371.094,332.437,377.344,318.375,371.094,324.625,364.844,318.375,371.094,332.437" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M371.094,286.346 C371.094,300.677 371.094,310.299 371.094,324.625" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="371.094,437.125,377.344,423.062,371.094,429.312,364.844,423.062,371.094,437.125" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M371.094,391.034 C371.094,405.364 371.094,414.987 371.094,429.312" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="371.094,541.812,377.344,527.75,371.094,534,364.844,527.75,371.094,541.812" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M371.094,495.721 C371.094,510.052 371.094,519.674 371.094,534" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="371.094,646.5,377.344,632.437,371.094,638.687,364.844,632.437,371.094,646.5" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M371.094,600.409 C371.094,614.739 371.094,624.362 371.094,638.687" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><?plantuml-src dLPjIsD75FwUNt5g2zj2Sgl6bvA5WeX28R3RZVHh6U-TwAqtC-dCP3NxgR62xjf-QhSIbIvMbe0YT6stdVoR-rDwvjmxkKcqoxOWIMRcp3dFSrwUyODOX4aduf1_VnhALakAeDrf9QK7O6AJyC1iro2rBrBx9Xq-Jsq_jRtKtgRsChMdRjCUflQ0VfocGppwZGpEKpjqziFltDtX4LuPUUIY1dNMvKg3R8BXWWa3N3Ib2dcB2uE64TSXHSvFKtj1GO_eivSEzrDxGiuFqk4XeJf9xLiAz9Am3Ponm_EQO0yWNzZVK_kB0-TGtY5WZydwZtJulNTgoRBWZuxG-cSYroCiHw1ant2LXRX9xLbgVwLOV-OGi-juzudShTJvKvv0WuST5Pika7iCyYFTFYBmjvJ6Ut88HEyDqUkHwGtX7vNam1VfEhFsMN4-UfIgKyB_YXBp0z31DNcrOsv-oixoZ64L4goCKGxj0GM_fOgSEugOYvpkBUKboznumrpJvrz4uP32NtXCPzx3FXdVaDiXUTltvEx90ntzJR_xlbrSMsriSzyosCjSGrF95Z1uobNSZ7a4Hkvm0Kn446lVSn6mBHRZBdOX2xSXSRrPoujQ1jPk9t78J2n56JTtAmaLKES5B4ERgqeUT8TtTHcFc48_pJWX1_ZDGHkfs1Ol0ruMHXE4KLe3M85Mh0tRSRC8Kl0C14GIEGY9mFRQKdEy9SqsxcVX7cY8c651IU_4eiqKQw4jveAtONvsR5CniUCsgxCbnKF3n1O2cld8V3mp5y3_cAKQX0cBMp2g4KYrnKJyZ984HONTPJTNnHZd0mnjPhQ1EkFI5TBUmAQCkZDbS92-cgXMRT8xXNu80lEeiBAvPwepfYPpB5NcxfCPO1gIkMdQym5EegkkaxQhiRuyepmSK_-v-HZhGcfYPpcWuJma8dsoF_5DsHyrlMCo5aLp4Q7QYQIBd0Wdze88krZ1a2U91pe_3RGQm0OHN9N2y3tZy9vxzUfvqJfmYfKZBJ9QO9mQm49XydbtOEz6sfGTrwEIsb7nRpjS6vVPR-IcnrkTnhiGm6EfpPRYZI_hyAJUg45ZRGFgZrPNwcwGWgnSNyVHU9Uyz6aZ9SvoETPkdk0LcMKKigCBBrzOhe5ZyVxn7q97Q6wWnPdGL14SFqFl3pHPd6ZFSG4-N5jTdrrVcUQw6FmtxQxTDN-tn4t9vdkgvOsRtNzvWiUqDt_3NDAGoED92QjHpKSYWriGCk5qIBP9Fac5SldnYLh4H7sslhYsEfsefG0UuRL6feh5gzAerkv_pmgvEFKZTapCBsaaNz7EW6ml9n-gjkBDU6zCc39FZkKa2YU_Bhxc2dMaekDez71aifqBDEr