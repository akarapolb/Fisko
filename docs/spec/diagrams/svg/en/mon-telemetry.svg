<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1470px;height:345px;background:#FFFFFF;" width="1470.313px" height="345.313px" viewBox="0 0 1470 345" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Telemetry path</title><desc>The application and adapters send metrics, logs and traces through the OpenTelemetry Collector, which drops forbidden attributes and sends metrics to Prometheus and logs to Loki. Grafana shows per-cell and per-tenant views, and alerts leave from Prometheus.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--entity app--><g class="entity" data-qualified-name="app" id="ent0001" data-source-line="10"><rect x="64.844" y="18.75" width="187.172" height="73.892" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="220.766" y="26.563" width="23.438" height="15.625" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;"/><rect x="217.641" y="29.688" width="6.25" height="3.125" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;"/><rect x="217.641" y="35.938" width="6.25" height="3.125" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;"/><text x="88.281" y="71.919" fill="#111827" font-size="20.313" textLength="124.672" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">App and relay</text></g><!--entity ad--><g class="entity" data-qualified-name="ad" id="ent0002" data-source-line="11"><rect x="86.719" y="132.813" width="143.026" height="73.892" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="198.495" y="140.625" width="23.438" height="15.625" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;"/><rect x="195.37" y="143.75" width="6.25" height="3.125" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;"/><rect x="195.37" y="150" widt