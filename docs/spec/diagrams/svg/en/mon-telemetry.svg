</text><text x="456.25" y="212.672" fill="#111827" font-size="20.313" textLength="236.48" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">drops forbidden attributes</text></g><!--entity p--><g class="entity" data-qualified-name="p" id="ent0005" data-source-line="14"><path d="M856.25,205.469 C856.25,189.844 925.661,189.844 925.661,189.844 C925.661,189.844 995.073,189.844 995.073,205.469 L995.073,273.566 C995.073,289.191 925.661,289.191 925.661,289.191 C925.661,289.191 856.25,289.191 856.25,273.566 L856.25,205.469" style="stroke:#4A5FA3;stroke-width:0.781;" fill="#ECF0FA"/><path d="M856.25,205.469 C856.25,221.094 925.661,221.094 925.661,221.094 C925.661,221.094 995.073,221.094 995.073,205.469" style="stroke:#4A5FA3;stroke-width:0.781;" fill="none"/><text x="871.875" y="249.263" fill="#000" font-size="20.313" textLength="107.573" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Prometheus</text><text x="893.169" y="276.28" fill="#000" font-size="20.313" textLength="64.984" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">metrics</text></g><!--entity l--><g class="entity" data-qualified-name="l" id="ent0006" data-source-line="15"><path d="M891.406,64.844 C891.406,49.219 925.732,49.219 925.732,49.219 C925.732,49.219 960.058,49.219 960.058,64.844 L960.058,132.941 C960.058,148.566 925.732,148.566 925.732,148.566 C925.732,148.566 891.406,148.566 891.406,132.941 L891.406,64.844" style="stroke:#4A5FA3;stroke-width:0.781;" fill="#ECF0FA"/><path d="M891.406,64.844 C891.406,80.469 925.732,80.469 925.732,80.469 C925.732,80.469 960.058,80.469 960.058,64.844" style="stroke:#4A5FA3;stroke-width:0.781;" fill="none"/><text x="907.492" y="108.638" fill="#000" font-size="20.313" textLength="36.479" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Loki</text><text x="907.031" y="135.655" fill="#000" font-size="20.313" textLength="37.402" font-family="'Leelawadee UI', Tahoma, '