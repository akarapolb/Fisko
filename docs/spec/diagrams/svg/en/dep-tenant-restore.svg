<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:703px;height:965px;background:#FFFFFF;" width="703.125px" height="965.625px" viewBox="0 0 703 965" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Per-tenant restore</title><desc>An operator gets approval with a reason, restores a copy of the cluster to an isolated environment, exports the tenant&#x27;s rows, checks the audit chain and imports into the live cell with that tenant in maintenance. Other tenants are not affected.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="348.466" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="38.925" y="85.938" width="619.083" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="54.55" y="123.482" fill="#000" font-size="20.313" textLength="587.833" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The agency asks; the operator records a reason and gets approval</text><rect x="197.731" y="175.455" width="301.472" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="213.356" y="212.999" fill="#000" font-size="20.313" textLength="270.222" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Put the tenant in maintenance</text><rect x="25" y="264.972" width="646.933" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="302.516" fill="#000" font-size="20.313" textLength="615.683" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Restore a cluster copy at the wanted time in an isolated environment</text><rect x="118.39" y="354.489" width="460.153" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="134.015" y="392.033" fill="#000" font-size="20.313" textLength="428.903" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Export the tenant's rows with the cell-move tool</text><rect x="223.607" y="522.101" width="249.718" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="239.232" y="559.645" fill="#000" font-size="20.313" textLength="218.468" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Stop and tell the auditor</text><ellipse cx="348.466" cy="639.516" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="348.466" cy="639.516" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="150.439,444.006,546.494,444.006,565.244,462.756,546.494,481.506,150.439,481.506,131.689,462.756,150.439,444.006" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="354.716" y="501.74" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="150.439" y="471.167" fill="#000" font-size="20.313" textLength="396.054" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Audit chain verifies against the checkpoints?</text><rect x="107.772" y="722.328" width="481.388" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="123.397" y="759.872" fill="#000" font-size="20.313" textLength="450.138" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Import to the live cell and rebuild the search index</text><rect x="136.818" y="811.845" width="423.297" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="152.443" y="849.39" fill="#000" font-size="20.313" textLength="392.047" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Write the audit entry and reopen the tenant</text><ellipse cx="348.466" cy="918.55" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="348.466" cy="918.55" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><line x1="348.466" y1="54.688" x2="348.466" y2="85.938" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="342.216,70.313,348.466,85.938,354.716,70.313,348.466,76.563" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="348.466" y1="144.205" x2="348.466" y2="175.455" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="342.216,159.83,348.466,175.455,354.716,159.83,348.466,166.08" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="348.466" y1="233.722" x2="348.466" y2="264.972" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="342.216,249.347,348.466,264.972,354.716,249.347,348.466,255.597" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="348.466" y1="323.239" x2="348.466" y2="354.489" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="342.216,338.864,348.466,354.489,354.716,338.864,348.466,345.114" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="348.466" y1="580.368" x2="348.466" y2="622.328" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="342.216,606.703,348.466,622.328,354.716,606.703,348.466,612.953" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="348.466" y1="481.506" x2="348.466" y2="522.101" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="342.216,506.476,348.466,522.101,354.716,506.476,348.466,512.726" fill="#5B6270" style="stroke:#5B62