<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2567px;height:470px;background:#FFFFFF;" width="2567.188px" height="470.313px" viewBox="0 0 2567 470" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of a phase</title><desc>A phase has no status field. The state is derived from its data: Waiting, Delivered, Accepted and Paid. Unaccepted phases are cancelled when the contract is terminated. An undelivered phase past its due date shows Overdue. An accepted phase is free again when its voucher is rejected or cancelled.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="475" y="373.438" width="85.112" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="482.813" y="413.098" fill="#000" font-size="20.313" textLength="69.487" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Waiting</text><rect x="1144.531" y="139.063" width="100.327" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1152.344" y="178.723" fill="#000" font-size="20.313" textLength="84.702" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Delivered</text><rect x="1754.688" y="139.063" width="99.523" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1762.5" y="178.723" fill="#000" font-size="20.313" textLength="83.898" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Accepted</text><rect x="2240.625" y="139.063" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="2260.392" y="178.723" fill="#000" font-size="20.313" textLength="38.592" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Paid</text><rect x="1753.125" y="335.938" width="102.459" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1760.938" y="375.598" fill="#000" font-size="20.313" textLength="86.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Cancelled</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="16"><ellipse cx="25" cy="401.563" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0014" data-source-line="23"><ellipse cx="2525" cy="287.5" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="2525" cy="287.5" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="26"><path d="M360.938,231.25 L360.938,256.189 A7.813,7.813 0 0 0 368.75,264.001 L510.938,264.001 L517.188,373.254 L523.438,264.001 L665.421,264.001 A7.813,7.813 0 0 0 673.233,256.189 L673.233,239.063 L657.608,223.438 L368.75,223.438 A7.813,7.813 0 0 0 360.938,231.25" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><path d="M657.608,223.438 L657.608,235.156 A3.906,3.906 0 0 0 661.514,239.063 L673.233,239.063 L657.608,223.438" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><text x="370.313" y="251.483" fill="#000" font-size="18.75" textLength="279.483" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Shows Overdue past the due date</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="29"><path d="M1010.938,318.75 L1010.938,343.689 A7.813,7.813 0 0 0 1018.75,351.501 L1370.508,351.501 A7.813,7.813 0 0 0 1378.32,343.689 L1378.32,326.563 L1362.695,310.938 L1200.781,310.938 L1194.531,202.075 L1188.281,310.938 L1018.75,310.938 A7.813,7.813 0 0 0 1010.938,318.75" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><path d="M1362.695,310.938 L1362.695,322.656 A3.906,3.906 0 0 0 1366.602,326.563 L1378.32,326.563 L1362.695,310.938" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><text x="1020.313" y="338.983" fill="#000" font-size="18.75" textLength="334.57" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">An open dissent stops further signatures</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-link-type="dependency"><polygon points="474.985,404.688,460.922,398.438,467.172,404.688,460.922,410.938,474.985,404.688" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M40.672,404.688 C105.041,404.688 364.306,404.688 467.172,404.688" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="137.5" y="398.358" fill="#000" font-size="18.75" textLength="127.817" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">contract signed</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="1144.255,187.247,1128.92,185.961,1136.876,189.812,1133.024,197.768,1144.255,187.247" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M559.407,390.554 C676.989,349.68 1009.738,234.008 1136.876,189.812" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="770.313" y="260.858" fill="#000" font-size="18.75" textLength="143.82" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">delivery recorded</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="1754.666,170.313,1740.603,164.063,1746.853,170.313,1740.603,176.563,1754.666,170.313" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1244.744,170.313 C1358.546,170