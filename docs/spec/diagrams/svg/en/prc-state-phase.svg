<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2567px;height:340px;background:#FFFFFF;" width="2567.188px" height="340.625px" viewBox="0 0 2567 340" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of a phase</title><desc>A phase has no status field. The state is derived from its data: Waiting, Delivered, Accepted and Paid. Unaccepted phases are cancelled when the contract is terminated. An undelivered phase past its due date shows Overdue.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="475" y="244.53" width="85.112" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="482.813" y="284.19" fill="#000" font-size="20.313" textLength="69.487" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Waiting</text><rect x="1144.531" y="10.155" width="100.327" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1152.344" y="49.815" fill="#000" font-size="20.313" textLength="84.702" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Delivered</text><rect x="1754.688" y="10.155" width="99.523" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1762.5" y="49.815" fill="#000" font-size="20.313" textLength="83.898" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Accepted</text><rect x="2240.625" y="10.155" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="2260.392" y="49.815" fill="#000" font-size="20.313" textLength="38.592" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Paid</text><rect x="1753.125" y="207.03" width="102.459" height="62.5"