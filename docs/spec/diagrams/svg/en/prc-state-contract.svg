<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2123px;height:392px;background:#FFFFFF;" width="2123.438px" height="392.188px" viewBox="0 0 2123 392" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of a contract</title><desc>A contract starts as a draft that commits nothing. Signing makes it active and commits the line. It closes with the case, or ends as terminated when the authorised approver approves a termination.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="454.688" y="263.149" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="472.451" y="302.81" fill="#000" font-size="20.313" textLength="42.599" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">draft</text><rect x="1074.219" y="30.337" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1087.345" y="69.997" fill="#000" font-size="20.313" textLength="51.872" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">active</text><rect x="1794.531" y="8.462" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1804.89" y="48.122" fill="#000" font-size="20.313" textLength="57.407" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">closed</text><rect x="1776.563" y="164.712" width="113.905" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1784.375" y="204.372" fill="#000" font-size="20.313" textLength="98.28" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">terminated</text><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="14"><ellipse cx="25" cy="291.274" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0007" data-source-line="15"><ellipse cx="2081.25" cy="194.399" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="2081.25" cy="194.399" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="22"><path d="M850,194.399 L850,219.338 A7.813,7.813 0 0 0 857.813,227.151 L1368.323,227.151 A7.813,7.813 0 0 0 1376.135,219.338 L1376.135,202.212 L1360.51,186.587 L1119.531,186.587 L1113.281,93.294 L1107.031,186.587 L857.813,186.587 A7.813,7.813 0 0 0 850,194.399" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><path d="M1360.51,186.587 L1360.51,198.305 A3.906,3.906 0 0 0 1364.417,202.212 L1376.135,202.212 L1360.51,186.587" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><text x="859.375" y="214.632" fill="#000" font-size="18.75" textLength="493.323" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">A change of amount or time adds a version; the status stays</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-link-type="dependency"><polygon points="454.515,294.399,440.452,288.149,446.702,294.399,440.452,300.649,454.515,294.399" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M41.008,294.399 C104.251,294.399 350.048,294.399 446.702,294.399" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="129.688" y="288.07" fill="#000" font-size="18.75" textLength="237.149" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">drafted from a case at step 8</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-link-type="dependency"><polygon points="2063.665,205.0