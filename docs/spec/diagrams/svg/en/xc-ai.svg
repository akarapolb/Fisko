<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:471px;height:1154px;background:#FFFFFF;" width="471.875px" height="1154.688px" viewBox="0 0 471 1154" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>The path of an AI request</title><desc>Every AI call passes the gateway. It checks that the agency has opted in and that policy allows the call, refuses restricted data, removes personal data, calls the agency&#x27;s provider, logs the call and returns advice for a person to decide on.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="230.623" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="99.496" y="85.938" width="262.255" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="115.121" y="123.482" fill="#000" font-size="20.313" textLength="231.005" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">A module calls AiGateway</text><rect x="59.332" y="253.549" width="342.583" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="74.957" y="291.093" fill="#000" font-size="20.313" textLength="311.333" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Refuse; the main feature still works</text><ellipse cx="230.623" cy="370.964" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="230.623" cy="370.964" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="100.948,175.455,360.299,175.455,379.049,194.205,360.299,212.955,100.948,212.955,82.198,194.205,100.948,175.455" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="236.873" y="233.188" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="100.948" y="202.615" fill="#000" font-size="20.313" textLength="259.351" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Agency opted in to this tool?</text><rect x="148.214" y="531.871" width="164.819" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="163.839" y="569.415" fill="#000" font-size="20.313" textLength="133.569" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Refuse and log</text><ellipse cx="230.623" cy="649.286" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="230.623" cy="649.286" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="132.83,453.777,328.417,453.777,347.167,472.527,328.417,491.277,132.83,491.277,114.08,472.527,132.83,453.777" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="236.873" y="511.51" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><text x="132.83" y="480.937" fill="#000" font-size="20.313" textLength="195.587" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Holds restricted data?</text><rect x="25" y="732.098" width="411.246" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="769.643" fill="#000" font-size="20.313" textLength="379.996" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Remove personal data under tenant policy</text><rect x="60.289" y="821.616" width="340.668" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="75.914" y="859.16" fill="#000" font-size="20.313" textLength="309.418" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Call the provider the agency chose</text><rect x="86.101" y="911.133" width="289.044" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="101.726" y="948.677" fill="#000" font-size="20.313" textLength="257.794" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Log the call and the provider</text><rect x="73.307" y="1000.65" width="314.633" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="88.932" y="1038.194" fill="#000" font-size="20.313" textLength="283.383" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Return advice; a person decides</text><ellipse cx="230.623" cy="1107.355" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="230.623" cy="1107.355" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><line x1="230.623" y1="54.688" x2="230.623" y2="85.938" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="224.373,70.313,230.623,85.938,236.873,70.313,230.623,76.563" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="230.623" y1="311.816" x2="230.623" y2="353.777" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="224.373,338.152,230.623,353.777,236.873,338.152,230.623,344.402" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="230.623" y1="212.955" x2="230.623" y2="253.549" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="224.373,237.924,230.623,253.549,236.873,237.924,230.623,244.174" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="379.049" y1="194.205" x2="417.54" y2="194.205" style="stroke:#5B6270;stroke-width:1.875;"/><polygon poi