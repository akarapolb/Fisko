<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:635px;height:1518px;background:#FFFFFF;" width="635.938px" height="1518.75px" viewBox="0 0 635 1518" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Closing the day and the month</title><desc>At the end of a day receipts, the cash report and payments are checked. At the end of a month the bank statement and trial balance are imported, the bank reconciliation is signed, six checks run, and the head of finance closes the period.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="315.017" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="144.356" y="85.938" width="341.323" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="159.981" y="123.482" fill="#000" font-size="20.313" textLength="310.073" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Record the day's receipts in GFMIS</text><rect x="106.389" y="175.455" width="417.257" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="122.014" y="212.999" fill="#000" font-size="20.313" textLength="386.007" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The committee counts and signs the report</text><rect x="105.625" y="264.972" width="418.784" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="121.25" y="302.516" fill="#000" font-size="20.313" textLength="387.534" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Check the day's payments against evidence</text><rect x="135.638" y="432.584" width="358.759" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="151.263" y="470.128" fill="#000" font-size="20.313" textLength="327.509" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Give a reason of at least 5 characters</text><polygon points="242.694,354.489,387.341,354.489,406.091,373.239,387.341,391.989,242.694,391.989,223.944,373.239,242.694,354.489" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="321.267" y="412.222" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="242.694" y="381.65" fill="#000" font-size="20.313" textLength="144.647" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Day checks pass</text><text x="406.091" y="368.533" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><polygon points="315.017,522.101,333.767,540.851,315.017,559.601,296.267,540.851,315.017,522.101" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="145.085" y="590.851" width="339.865" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="160.71" y="628.395" fill="#000" font-size="20.313" textLength="308.615" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The head of finance closes the day</text><rect x="108.065" y="680.368" width="413.905" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="123.69" y="717.912" fill="#000" font-size="20.313" textLength="382.655" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">At month end, import the bank statements</text><rect x="117.78" y="769.885" width="394.475" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="133.405" y="807.43" fill="#000" font-size="20.313" textLength="363.225" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Match three ways, book bank-only items</text><rect x="142.447" y="859.402" width="345.142" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="158.072" y="896.947" fill="#000" font-size="20.313" textLength="313.892" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Sign the bank reconciliation, SD-15</text><rect x="105.824" y="948.92" width="418.388" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="121.449" y="986.464" fill="#000" font-size="20.313" textLength="387.138" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Import the revenue report and trial balance</text><rect x="198.246" y="1038.437" width="233.542" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="213.871" y="1075.981" fill="#000" font-size="20.313" textLength="202.292" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Review open advances</text><rect x="130.163" y="1206.049" width="369.709" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="145.788" y="1243.593" fill="#000" font-size="20.313" textLength="338.459" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Give a reason of at least 10 characters</text><polygon points="240.17,1127.954,389.865,1127.954,408.615,1146.704,389.865,1165.454,240.17,1165.454,221.42,1146.704,240.17,1127.954" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="321.267" y="1185.687" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="240.17" y="1155.115" fill="#000" font-size="20.313" textLength="149.696" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">All 6 checks pass</text><text x="408.615" y="1141.998" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><polygon points="315.017,1295.566,333.767,1314.316,315.017,1333.066,296.267,1314.316,315.017,1295.566" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="25" y="1364.316" width="580.035" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="1401.86" fill="#000" font-size="20.313" textLength="548.785" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The head of finance closes; the executive and auditor are told</text><ellipse cx="315.017" cy="1471.021" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="315.017" cy="1471.021" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><line x1="315.017" y1="54.688" x2="315.017" y2="85.938" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="308.767,70.313,315.017,85.938,321.267,70.313,315.017,76.563" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="315.017" y1="144.205" x2="315.017" y2="175.455" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="308.767,159.83,315.017,175.455,321.267,159.83,315.017,166.08" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="315.017" y1="233.722" x2="315.017" y2="264.972" style="stroke:#5B6270;stroke-width:1.875;"/><polygon points="308.767,249.347,315.017,264.972,321.267,249.347,315.017,255.597" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="315.017" y1="391.989" x2="315.01