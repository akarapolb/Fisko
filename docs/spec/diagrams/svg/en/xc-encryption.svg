<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1140px;height:665px;background:#FFFFFF;" width="1140.625px" height="665.625px" viewBox="0 0 1140 665" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Key hierarchy</title><desc>A master key in KMS, an HSM or OpenBao wraps the per-tenant data keys. These encrypt restricted fields and files, and the blind index has its own key. Per-subject keys encrypt personal details, and sealing keys encrypt sealed replies. The database sees ciphertext only.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><!--entity mk--><g class="entity" data-qualified-name="mk" id="ent0001" data-source-line="10"><rect x="9.375" y="323.438" width="270.078" height="127.927" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="248.203" y="331.25" width="23.438" height="15.625" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="245.078" y="334.375" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="245.078" y="340.625" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><text x="87.665" y="376.607" fill="#111827" font-size="20.313" textLength="97.873" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Master key</text><text x="32.813" y="403.624" fill="#111827" font-size="20.313" textLength="207.578" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">KMS, HSM or OpenBao</text><text x="81.63" y="430.641" fill="#111827" font-size="20.313" textLength="109.943" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">never leaves</text></g><!--entity dk--><g class="entity" data-qualified-name="dk" id="ent0002" data-source-line="11"><rect x="477.344" y="155.469" width="213.783" height="73.892" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="659.876" y="163.281" width="23.438" height="15.625" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="656.751" y="166.406" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="656.751" y="172.656" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><text x="500.781" y="208.638" fill="#111827" font-size="20.313" textLength="151.283" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Tenant data keys</text></g><!--entity bk--><g class="entity" data-qualified-name="bk" id="ent0003" data-source-line="12"><rect x="485.938" y="291.406" width="197.437" height="73.892" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="652.125" y="299.219" width="23.438" height="15.625" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="649" y="302.344" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="649" y="308.594" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><text x="509.375" y="344.576" fill="#111827" font-size="20.313" textLength="134.937" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Blind index key</text></g><!--entity sk--><g class="entity" data-qualified-name="sk" id="ent0004" data-source-line="13"><rect x="480.469" y="408.594" width="208.278" height="73.892" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><rect x="657.497" y="416.406" width="23.438" height="15.625" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="654.372" y="419.531" width="6.25" height="3.125" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;"/><rect x="654.372" y="425.781" width="6.25" height="3.125" fill="#E8F5EC" style