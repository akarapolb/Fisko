<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2246px;height:465px;background:#FFFFFF;" width="2246.875px" height="465.625px" viewBox="0 0 2246 465" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of a delegation</title><desc>A delegation&#x27;s state is derived from its dates and revocation. It is future before the start date, active within the dates, expired after the end date and revoked when the delegator or the administrator revokes it. Production adds a held state while either person is suspended or has changed role.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="480.469" y="379.19" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="492.574" y="418.851" fill="#000" font-size="20.313" textLength="53.915" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">future</text><rect x="921.875" y="160.44" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="935.001" y="200.101" fill="#000" font-size="20.313" textLength="51.872" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">active</text><rect x="1509.375" y="155.753" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1528.938" y="195.414" fill="#000" font-size="20.313" textLength="38.998" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">held</text><rect x="1928.906" y="29.19" width="82.077" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="1936.719" y="68.851" fill="#000" font-size="20.313" textLength="66.452" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan,