<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:570px;height:1640px;background:#FFFFFF;" width="570.313px" height="1640.625px" viewBox="0 0 570 1640" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>The CI and CD pipeline</title><desc>Each pull request passes build, tests, module boundaries, RLS checks, scans and the licence audit. A release gains an SBOM and signatures, is tested on both setups, and Argo CD applies it one cell at a time.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="282.589" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="25" y="70.313" width="515.177" height="403.836" fill="none" style="stroke:#000;stroke-width:2.344;" rx="7.813" ry="7.813"/><path d="M146.165,70.313 L146.165,86.392 L130.54,102.017 L25,102.017" style="stroke:#000;stroke-width:2.344;" fill="none"/><text x="29.688" y="93.794" fill="#000" font-size="20.313" textLength="105.54" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Pull request</text><rect x="106.378" y="128.58" width="352.422" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="122.003" y="166.124" fill="#000" font-size="20.313" textLength="321.172" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Build, unit tests, module boundaries</text><rect x="40.625" y="218.097" width="483.927" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="56.25" y="255.641" fill="#000" font-size="20.313" textLength="452.677" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Integration with Testcontainers, RLS on every table</text><rect x="72.601" y="307.614" width="419.975" height="58.267