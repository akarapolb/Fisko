.563;"/></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-line="37"><path d="M145.313,170.313 L145.313,176.563 L92.303,182.813 L145.313,189.063 L145.313,195.251 A7.813,7.813 0 0 0 153.125,203.064 L772.052,203.064 A7.813,7.813 0 0 0 779.865,195.251 L779.865,178.125 L764.24,162.5 L153.125,162.5 A7.813,7.813 0 0 0 145.313,170.313" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><path d="M764.24,162.5 L764.24,174.219 A3.906,3.906 0 0 0 768.146,178.125 L779.865,178.125 L764.24,162.5" style="stroke:#15803D;stroke-width:0.781;" fill="#E8F5EC"/><text x="154.688" y="190.546" fill="#000" font-size="18.75" textLength="601.74" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The owner can withdraw from unit, plan, committee or exec back to draft</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0001" id="lnk11" data-link-type="dependency"><polygon points="53.125,151.248,59.375,137.185,53.125,143.435,46.875,137.185,53.125,151.248" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M53.125,56.497 C53.125,80.079 53.125,114.68 53.125,143.435" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-link-type="dependency"><polygon points="265.243,338.523,257.541,325.2,258.923,333.93,250.192,335.312,265.243,338.523" fill="#5B6270" style="stroke:#5B6270;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M92.432,212.939 C139.554,247.183 211.739,299.641 258.923,333.93" style="stroke:#5B6270;stroke-width:1.875;" fill="none"/><text x="198.438" y="284.296" fill="#000" font-size="18.75" textLength="39.413" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">send</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk13" data-link-type="dependency"><polygon points="503.698,523.31,496.403,509.76,497