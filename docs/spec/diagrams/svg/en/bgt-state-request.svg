<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1237px;height:1334px;background:#FFFFFF;" width="1237.5px" height="1334.375px" viewBox="0 0 1237 1334" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>States of a budget request</title><desc>A request starts as a draft. The division director approves it, Planning reviews it, and it goes to the committee when the condition applies, otherwise to the executive. It can be returned, withdrawn, cancelled or rejected.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><rect x="14.063" y="151.563" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="31.826" y="191.223" fill="#000" font-size="20.313" textLength="42.599" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">draft</text><rect x="265.625" y="337.5" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="287.291" y="377.161" fill="#000" font-size="20.313" textLength="34.793" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">unit</text><rect x="503.125" y="523.438" width="78.125" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="522.842" y="563.098" fill="#000" font-size="20.313" textLength="38.691" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">plan</text><rect x="878.125" y="709.375" width="111.832" height="62.5" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="885.938" y="749.036" fill="#000" font-size="20.313" textLength="96.207" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">committee</text><rect x="607.813" y="709.375" width="78.125" heigh