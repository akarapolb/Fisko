<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:639px;height:1420px;background:#FFFFFF;" width="639.063px" height="1420.313px" viewBox="0 0 639 1420" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>Creating a delegation</title><desc>The delegator picks the delegate, scope, dates and reason. The system checks the right to delegate, the delegate and the date order, then checks for overlap under the policy that OI-PLT-01 will decide. It then saves, numbers the delegation and notifies the delegate.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="282.818" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="25" y="85.938" width="515.636" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="123.482" fill="#000" font-size="20.313" textLength="484.386" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">The delegator picks delegate, scope, dates and reason</text><rect x="157.081" y="253.549" width="251.474" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="172.706" y="291.093" fill="#000" font-size="20.313" textLength="220.224" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Refuse: no re-delegation</text><ellipse cx="282.818" cy="370.964" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="282.818" cy="370.964" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="98.21,175.455,467.426,175.455,486.176,194.205,467.426,212.955,98.21,212.955,79.46,194.205,98.21,175.455" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="289.068" y="233.188" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="98.21" y="202.615" fill="#000" font-size="20.313" textLength="369.215" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Delegator holds the scope's role directly?</text><text x="486.176" y="189.499" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><rect x="150.371" y="531.871" width="264.893" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="165.996" y="569.415" fill="#000" font-size="20.313" textLength="233.643" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Refuse and name the field</text><ellipse cx="282.818" cy="649.286" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="282.818" cy="649.286" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><polygon points="167.776,453.777,397.859,453.777,416.609,472.527,397.859,491.277,167.776,491.277,149.026,472.527,167.776,453.777" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="289.068" y="511.51" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><text x="167.776" y="480.937" fill="#000" font-size="20.313" textLength="230.083" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Delegate and dates valid?</text><text x="416.609" y="467.821" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><rect x="189.439" y="810.193" width="186.758" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="20