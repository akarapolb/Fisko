<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:637px;height:1325px;background:#FFFFFF;" width="637.5px" height="1325px" viewBox="0 0 637 1325" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><title>The budget cycle from strategy to results</title><desc>Planning sets strategy and ceilings, units prepare requests, Planning consolidates, reviewers approve, the batch goes to the Budget Bureau, the bill passes parliament, lines are created, the year is managed, results are reported, and they feed next year.</desc><?plantuml 1.2026.9?><defs/><g font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif" lengthAdjust="spacing"><ellipse cx="317.634" cy="39.063" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="159.985" y="85.938" width="315.298" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="175.61" y="123.482" fill="#000" font-size="20.313" textLength="284.048" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Strategy, KPIs, project bank (B2)</text><rect x="223.219" y="175.455" width="188.831" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="238.844" y="212.999" fill="#000" font-size="20.313" textLength="157.581" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Issue ceilings (B4)</text><rect x="122.827" y="264.972" width="389.615" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="138.452" y="302.516" fill="#000" font-size="20.313" textLength="358.365" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Prepare requests, director approves (B3)</text><rect x="132.552" y="354.489" width="370.165" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="148.177" y="392.033" fill="#000" font-size="20.313" textLength="338.915" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Consolidate, rank, 3R, zero-based (B4)</text><polygon points="183.738,444.006,451.53,444.006,470.28,462.756,451.53,481.506,183.738,481.506,164.988,462.756,183.738,444.006" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="183.738" y="471.167" fill="#000" font-size="20.313" textLength="267.792" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Committee condition applies?</text><text x="138.154" y="458.051" fill="#000" font-size="18.75" textLength="26.834" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">yes</text><text x="470.28" y="458.051" fill="#000" font-size="18.75" textLength="21.597" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">no</text><rect x="25" y="497.131" width="248.727" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="40.625" y="534.676" fill="#000" font-size="20.313" textLength="217.477" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Committee resolves (B5)</text><rect x="364.587" y="497.131" width="242.637" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="380.212" y="534.676" fill="#000" font-size="20.313" textLength="211.387" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Executive approves (B5)</text><polygon points="317.634,564.774,336.384,583.524,317.634,602.274,298.884,583.524,317.634,564.774" fill="#E8F5EC" style="stroke:#15803D;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="115.874" y="633.524" width="403.52" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="131.499" y="671.068" fill="#000" font-size="20.313" textLength="372.27" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Minister approves, batch sent, results (B6)</text><rect x="171.565" y="723.041" width="292.139" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="187.19" y="760.585" fill="#000" font-size="20.313" textLength="260.889" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Parliament, cuts, appeals (B6)</text><rect x="201.637" y="812.558" width="231.995" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="217.262" y="850.102" fill="#000" font-size="20.313" textLength="200.745" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Lines from the act (B7)</text><rect x="127.994" y="902.075" width="379.28" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="143.619" y="939.619" fill="#000" font-size="20.313" textLength="348.03" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Plan, releases, transfers, carry-over (B7)</text><rect x="201.31" y="991.592" width="232.649" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="216.935" y="1029.137" fill="#000" font-size="20.313" textLength="201.399" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Monitor spending (B8)</text><rect x="191.59" y="1081.11" width="252.089" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="207.215" y="1118.654" fill="#000" font-size="20.313" textLength="220.839" font-family="'Leelawadee UI', Tahoma, 'Noto Sans Thai', Anuphan, sans-serif">Report and evaluate (B9)</text><rect x="94.163" y="1170.627" width="446.942" height="58.267" fill="#FFF" style="stroke:#15803D;stroke-width:0.781;" rx="7.813" ry="7.813"/><text x="10